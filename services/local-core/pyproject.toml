[project]
name = "book-os-local-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "alembic==1.16.5",
  "httpx==0.28.1",
  "numpy==2.3.2",
  "python-docx==1.2.0",
  "reportlab==5.0.1",
  "EbookLib==0.20",
  "pillow==12.3.0",
  "pypdf==6.18.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint.per-file-ignores]
"src/book_os_core/series_workspace.py" = ["F401", "F405"]
[tool.mypy]
strict = true
files = ["src"]
