name: Task014 Clean Identifiers Once
on: push
permissions:
  contents: write
jobs:
  clean:
    if: github.ref_name == 'brain/task-014-prose-anti-junk-panel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-014-prose-anti-junk-panel
      - name: Restore internal TypeScript identifiers
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'apps/desktop/src/ResearchPanel.tsx': {
                  'setОграничения доказательства': 'setLimitations',
              },
              'apps/desktop/src/PilotPanel.tsx': {
                  'observationСерьёзность': 'observationSeverity',
                  'setObservationСерьёзность': 'setObservationSeverity',
                  'setРешениеReason': 'setDecisionReason',
                  'setРешение': 'setDecision',
                  'recordFinalРешение': 'recordFinalDecision',
              },
          }
          for path, pairs in replacements.items():
              p = Path(path)
              text = p.read_text()
              for old, new in pairs.items():
                  text = text.replace(old, new)
              p.write_text(text)
          Path('.github/workflows/task014-clean-identifiers-once.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "BOOK OS Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Clean internal identifiers after Russian localization"
          git push origin HEAD:brain/task-014-prose-anti-junk-panel
