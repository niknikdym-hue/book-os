name: M3 Lint Fix
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/brain/task-004-model-gateway-drafting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: brain/task-004-model-gateway-drafting }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python .github/scripts/m3_lint_fix.py
      - name: Commit exact lint fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add services/local-core/src/book_os_core/drafting.py apps/desktop/src/DraftingPanel.tsx
          git commit -m "fix: satisfy M3 Python and React lint gates"
          git push origin HEAD:brain/task-004-model-gateway-drafting
