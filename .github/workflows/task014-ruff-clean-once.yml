name: Task014 Ruff Clean Once
on: push
permissions:
  contents: write
jobs:
  clean:
    if: github.ref_name == 'brain/task-014-prose-anti-junk-panel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-014-prose-anti-junk-panel
      - name: Remove unused planning import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/local-core/src/book_os_core/planning.py')
          text = p.read_text().replace('    ProjectGateError,\n', '')
          p.write_text(text)
          Path('.github/workflows/task014-ruff-clean-once.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "BOOK OS Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove final Task014 lint residue"
          git push origin HEAD:brain/task-014-prose-anti-junk-panel
