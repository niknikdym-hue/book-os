name: Authority Hash Sync Once

on:
  push:
    branches:
      - brain/post-task-012-authority-sync
    paths:
      - .github/workflows/authority-hash-sync-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/post-task-012-authority-sync
          fetch-depth: 0
      - name: Recompute design hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          hash_file = Path('docs/DESIGN_FILE_HASHES.sha256')
          paths = []
          for line in hash_file.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              _, path = line.split('  ', 1)
              paths.append(path)

          for path in [
              'docs/IMPLEMENTATION_ROADMAP_v0.2.md',
              'docs/decisions/2026-08-29-global-openai-first.md',
              'docs/tasks/TASK_011_REAL_BOOK_PILOT.md',
          ]:
              if path not in paths:
                  paths.append(path)

          lines = []
          for path in paths:
              p = Path(path)
              if not p.is_file():
                  continue
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              lines.append(f'{digest}  {path}')

          hash_file.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/authority-hash-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DESIGN_FILE_HASHES.sha256 .github/workflows/authority-hash-sync-once.yml
          git commit -m "Sync authority design hashes" || exit 0
          git push origin HEAD:brain/post-task-012-authority-sync
