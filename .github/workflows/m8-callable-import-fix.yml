name: M8 final Callable import fix
on:
  push:
    branches: [brain/task-009-russia-provider-lane]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-009-russia-provider-lane
          fetch-depth: 0
      - run: python tools/m8_callable_import_fix.py
      - run: |
          rm .github/workflows/m8-callable-import-fix.yml tools/m8_callable_import_fix.py
          git config user.name niknikdym-hue
          git config user.email niknikdym@gmail.com
          git add -A
          git commit -m 'fix: import Callable for GigaChat clock typing'
          git push origin HEAD:brain/task-009-russia-provider-lane
