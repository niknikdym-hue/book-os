name: M8 Brain Stage A completion
on:
  push:
    branches: [brain/task-009-russia-provider-lane]
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-009-russia-provider-lane
          fetch-depth: 0
      - name: Run bounded completion script
        run: python tools/m8_brain_complete.py
      - name: Format and check bounded files
        run: |
          cd services/local-core
          ruff format src/book_os_core/provider_lane.py src/book_os_core/model_gateway.py src/book_os_core/app.py tests/test_provider_lane.py
          ruff check src/book_os_core/provider_lane.py src/book_os_core/model_gateway.py src/book_os_core/app.py tests/test_provider_lane.py
      - name: Self-clean and publish
        run: |
          rm .github/workflows/m8-brain-stage-a.yml tools/m8_brain_complete.py
          git config user.name niknikdym-hue
          git config user.email niknikdym@gmail.com
          git add -A
          git commit -m 'WIP: close M8 routing evidence and API gates'
          git push origin HEAD:brain/task-009-russia-provider-lane
