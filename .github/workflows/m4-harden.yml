name: M4 Harden
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/brain/task-005-research-claim-ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: brain/task-005-research-claim-ledger }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python .github/scripts/m4_harden.py
      - name: Commit hardening
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add services/local-core/src/book_os_core/research.py services/local-core/src/book_os_core/drafting.py services/local-core/src/book_os_core/backup.py apps/desktop/src/draftingTypes.ts
          git commit -m "fix: enforce M4 evidence and review invariants"
          git push origin HEAD:brain/task-005-research-claim-ledger
