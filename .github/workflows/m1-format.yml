name: M1 Formatter
on: [push]
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/codex/task-002-authority-persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/task-002-authority-persistence
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r services/local-core/requirements-dev.lock
      - run: ruff format services/local-core
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add services/local-core
          git commit -m "style: apply pinned M1 formatter"
          git push origin HEAD:codex/task-002-authority-persistence
