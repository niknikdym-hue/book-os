name: M3 Source Sync
on: [push]
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/brain/task-004-model-gateway-drafting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: brain/task-004-model-gateway-drafting }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r services/local-core/requirements-dev.lock
      - run: python .github/scripts/m3_source_sync.py
      - run: ruff format services/local-core
      - name: Commit exact M3 integration output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add services/local-core apps/desktop/src/App.tsx apps/desktop/src/styles.css
          git commit -m "fix: integrate M3 gateway drafting vertical"
          git push origin HEAD:brain/task-004-model-gateway-drafting
