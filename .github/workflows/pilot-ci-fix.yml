name: Pilot final CI fix once
on:
  push:
    branches: [brain/task-011-real-book-pilot]
    paths:
      - '.github/workflows/pilot-ci-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-011-real-book-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path

          pilot = Path('services/local-core/src/book_os_core/pilot.py')
          text = pilot.read_text()
          text = text.replace('from typing import Any, Literal, cast\n', 'from typing import Any, Literal\n', 1)
          pilot.write_text(text)

          test = Path('services/local-core/tests/test_pilot.py')
          text = test.read_text()
          text = text.replace('from typing import cast\n', 'from typing import Any, cast\n', 1)
          text = text.replace('actor_kind=cast("HUMAN", "SYSTEM")', 'actor_kind=cast(Any, "SYSTEM")', 1)
          test.write_text(text)

          desktop = Path('apps/desktop/src/PilotPanel.test.tsx')
          text = desktop.read_text()
          duplicate = '''    if (method === "GET" && path.includes("/observations?open_only=true")) return [] as never;\n    if (method === "GET" && path.includes("/observations?open_only=true")) return [] as never;\n'''
          text = text.replace(
              duplicate,
              '    if (method === "GET" && path.includes("/observations?open_only=true")) return [] as never;\n',
              1,
          )
          second_anchor = '''    if (method === "GET" && path.endsWith("/pilots/active")) return pilot as never;\n    if (method === "GET" && path.endsWith("/summary")) return summary(false) as never;\n    if (method === "POST" && path.endsWith("/openai-preflight")) {\n'''
          second_new = '''    if (method === "GET" && path.endsWith("/pilots/active")) return pilot as never;\n    if (method === "GET" && path.endsWith("/summary")) return summary(false) as never;\n    if (method === "GET" && path.includes("/observations?open_only=true")) return [] as never;\n    if (method === "POST" && path.endsWith("/openai-preflight")) {\n'''
          if second_anchor not in text:
              raise SystemExit('second PilotPanel test mock anchor missing')
          desktop.write_text(text.replace(second_anchor, second_new, 1))
          PY
      - run: pip install ruff==0.12.11
      - run: ruff format services/local-core/src/book_os_core/pilot.py services/local-core/tests/test_pilot.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pilot-ci-fix.yml
          git add services/local-core/src/book_os_core/pilot.py services/local-core/tests/test_pilot.py apps/desktop/src/PilotPanel.test.tsx
          git commit -m 'fix: close final real-book pilot CI regressions'
          git push origin HEAD:brain/task-011-real-book-pilot
