name: Pilot wire API once
on:
  push:
    branches: [brain/task-011-real-book-pilot]
    paths:
      - '.github/workflows/pilot-wire-api.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-011-real-book-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/local-core/src/book_os_core/app.py')
          text = path.read_text()
          anchor = 'from .literary_master_api import build_literary_master_router\n'
          if 'from .pilot_api import build_pilot_router\n' not in text:
              text = text.replace(anchor, anchor + 'from .pilot_api import build_pilot_router\n', 1)
          anchor2 = '        app.include_router(build_literary_master_router(configured_data_dir, require_token))\n'
          if 'app.include_router(build_pilot_router' not in text:
              text = text.replace(
                  anchor2,
                  anchor2 + '        app.include_router(build_pilot_router(configured_data_dir, require_token))\n',
                  1,
              )
          path.write_text(text)
          PY
      - run: pip install ruff==0.12.11
      - run: ruff format services/local-core/src/book_os_core/app.py services/local-core/src/book_os_core/pilot.py services/local-core/src/book_os_core/pilot_api.py services/local-core/tests/test_pilot.py services/local-core/alembic/versions/0010_real_book_pilot.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pilot-wire-api.yml
          git add services/local-core
          git commit -m 'Pilot: wire authenticated API and format pilot backend'
          git push origin HEAD:brain/task-011-real-book-pilot
