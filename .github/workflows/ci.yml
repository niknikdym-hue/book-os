name: CI
on: [pull_request, push]
jobs:
  local-core:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/local-core } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.lock
      - run: PYTHONPATH=src ruff format --check .
      - run: PYTHONPATH=src ruff check .
      - run: PYTHONPATH=src mypy src
      - run: PYTHONPATH=src pytest
  desktop:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/desktop/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
