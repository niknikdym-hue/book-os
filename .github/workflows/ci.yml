name: CI
on: [pull_request, push]
jobs:
  local-core:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/local-core } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.lock
      - run: ruff format --diff .
      - run: ruff check .
      - run: mypy src
      - run: pytest
  desktop:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/desktop/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
  tauri-smoke:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/desktop/src-tauri } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo check --locked
  macos-native-launch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/desktop/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare local Python Core
        run: |
          python3.12 -m venv services/local-core/.venv
          services/local-core/.venv/bin/pip install -r services/local-core/requirements-dev.lock
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile --prod=false
      - name: Build production macOS app bundle
        working-directory: apps/desktop
        run: pnpm tauri build --bundles app
      - name: Launch packaged app and verify frontend plus local core
        env:
          RUST_BACKTRACE: '1'
        run: |
          APP="$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/release/bundle/macos/BOOK OS.app"
          EXEC="$APP/Contents/MacOS/BOOK OS"
          LOG="$RUNNER_TEMP/book-os-native-launch.log"
          FRONTEND_MARKER="$RUNNER_TEMP/book-os-frontend-ready"
          CORE_MARKER="$RUNNER_TEMP/book-os-core-ready"

          test -d "$APP"
          test -x "$EXEC"
          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          rm -f "$FRONTEND_MARKER" "$CORE_MARKER"

          BOOK_OS_FRONTEND_READY_FILE="$FRONTEND_MARKER" \
          BOOK_OS_CORE_READY_FILE="$CORE_MARKER" \
          "$EXEC" >"$LOG" 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for _ in {1..120}; do
            if [ -s "$FRONTEND_MARKER" ] && [ -s "$CORE_MARKER" ]; then
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG"
              echo "BOOK OS packaged app exited before frontend/core readiness"
              exit 1
            fi
            sleep 0.25
          done

          if [ ! -s "$FRONTEND_MARKER" ]; then
            cat "$LOG"
            echo "BOOK OS packaged app stayed alive but the frontend never mounted"
            exit 1
          fi
          if [ ! -s "$CORE_MARKER" ]; then
            cat "$LOG"
            echo "BOOK OS packaged app stayed alive but the local core never became healthy"
            exit 1
          fi

          grep -F "ready" "$FRONTEND_MARKER"
          grep -F "healthy" "$CORE_MARKER"
          grep -F "BOOK OS frontend ready" "$LOG"
          grep -F "BOOK OS local core healthy" "$LOG"
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
