name: M4 UI Integrate
on: [push]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/brain/task-005-research-claim-ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: brain/task-005-research-claim-ledger }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python .github/scripts/m4_ui_integrate.py
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add apps/desktop/src/App.tsx
          git commit -m "feat: integrate M4 ResearchPanel into book workspace"
          git push origin HEAD:brain/task-005-research-claim-ledger
