name: M9 hardening once
on:
  push:
    branches: [brain/task-010-literary-master]
    paths:
      - '.github/workflows/m9-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-010-literary-master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          for rel in [
              'services/local-core/tests/test_authority.py',
              'services/local-core/tests/test_bookbench.py',
              'services/local-core/tests/test_editorial.py',
              'services/local-core/tests/test_memory.py',
              'services/local-core/tests/test_projects.py',
              'services/local-core/tests/test_research.py',
          ]:
              path = root / rel
              text = path.read_text()
              text = text.replace('== "0008"', '== "0009"')
              path.write_text(text)

          panel = root / 'apps/desktop/src/LiteraryMasterPanel.tsx'
          text = panel.read_text()
          text = text.replace(
              'import { useEffect, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useMemo, useState } from "react";',
          )
          old = '''  async function refresh() {\n    const [nextReadiness, nextMasters] = await Promise.all([\n      coreApi<ReleaseReadiness>(\n        "GET",\n        `/api/projects/${project.book_id}/literary-master/readiness`,\n      ),\n      coreApi<LiteraryMaster[]>("GET", `/api/projects/${project.book_id}/literary-masters`),\n    ]);\n    setReadiness(nextReadiness);\n    setMasters(nextMasters);\n  }\n\n  useEffect(() => {\n    setError(null);\n    setExportEvidence(null);\n    setHandoffEvidence(null);\n    void refresh().catch((reason: unknown) => setError(String(reason)));\n  }, [project.book_id]);\n'''
          new = '''  const refresh = useCallback(async () => {\n    const [nextReadiness, nextMasters] = await Promise.all([\n      coreApi<ReleaseReadiness>(\n        "GET",\n        `/api/projects/${project.book_id}/literary-master/readiness`,\n      ),\n      coreApi<LiteraryMaster[]>("GET", `/api/projects/${project.book_id}/literary-masters`),\n    ]);\n    setReadiness(nextReadiness);\n    setMasters(nextMasters);\n  }, [project.book_id]);\n\n  useEffect(() => {\n    setError(null);\n    setExportEvidence(null);\n    setHandoffEvidence(null);\n    void refresh().catch((reason: unknown) => setError(String(reason)));\n  }, [refresh]);\n'''
          if old not in text:
              raise SystemExit('LiteraryMasterPanel refresh anchor not found')
          panel.write_text(text.replace(old, new, 1))

          lm = root / 'services/local-core/src/book_os_core/literary_master.py'
          text = lm.read_text()
          class_anchor = '''class LiteraryMasterService:\n    MANIFEST_VERSION = "literary-master.v1"\n    HANDOFF_VERSION = "book-os-audiobook-handoff.v1"\n'''
          class_new = '''class LiteraryMasterService:\n    MANIFEST_VERSION = "literary-master.v1"\n    HANDOFF_VERSION = "book-os-audiobook-handoff.v1"\n    REQUIRED_DETERMINISTIC_CHECK_IDS = (\n        "deterministic.repetition",\n        "deterministic.statistics",\n        "deterministic.specificity",\n        "deterministic.evidence",\n        "deterministic.contract_structure",\n        "deterministic.ai_prose_pathology",\n        "deterministic.opening_ending_transition",\n    )\n'''
          if class_anchor not in text:
              raise SystemExit('LiteraryMasterService class anchor not found')
          text = text.replace(class_anchor, class_new, 1)

          old_waive = '''        waived_count = int(\n            connection.execute(\n                text(\n                    "SELECT COUNT(*) FROM editorial_findings "\n                    "WHERE book_id=:book_id AND status='WAIVED' AND severity IN ('MAJOR','CRITICAL')"\n                ),\n                {"book_id": book_id},\n            ).scalar_one()\n        )\n'''
          new_waive = '''        waived_count = 0\n        waived_editorial = list(\n            connection.execute(\n                text(\n                    "SELECT f.finding_id,f.severity,"\n                    "(SELECT h.actor_kind FROM editorial_finding_state_history h "\n                    "WHERE h.finding_id=f.finding_id AND h.new_state='WAIVED' "\n                    "ORDER BY h.created_at DESC,h.state_event_id DESC LIMIT 1) AS waiver_actor_kind "\n                    "FROM editorial_findings f WHERE f.book_id=:book_id "\n                    "AND f.status='WAIVED' AND f.severity IN ('MAJOR','CRITICAL')"\n                ),\n                {"book_id": book_id},\n            ).mappings()\n        )\n        for finding in waived_editorial:\n            if str(finding["waiver_actor_kind"]) != "HUMAN":\n                blockers.append(\n                    ReleaseBlocker(\n                        code="EDITORIAL_WAIVER_NOT_HUMAN",\n                        detail=f"Material waiver {finding['finding_id']} lacks human decision evidence",\n                    )\n                )\n            else:\n                waived_count += 1\n'''
          if old_waive not in text:
              raise SystemExit('waiver anchor not found')
          text = text.replace(old_waive, new_waive, 1)

          old_evidence = '''            succeeded = int(\n                connection.execute(\n                    text(\n                        "SELECT COUNT(*) FROM evaluation_runs "\n                        "WHERE snapshot_id=:snapshot_id AND status='SUCCEEDED'"\n                    ),\n                    {"snapshot_id": snapshot_id},\n                ).scalar_one()\n            )\n            if succeeded == 0:\n                blockers.append(\n                    ReleaseBlocker(\n                        code="BOOKBENCH_EVIDENCE_MISSING",\n                        detail="Latest BookBench snapshot has no successful evaluations",\n                    )\n                )\n'''
          new_evidence = '''            succeeded_check_ids = {\n                str(value)\n                for value in connection.execute(\n                    text(\n                        "SELECT DISTINCT check_id FROM evaluation_runs "\n                        "WHERE snapshot_id=:snapshot_id AND status='SUCCEEDED'"\n                    ),\n                    {"snapshot_id": snapshot_id},\n                ).scalars()\n            }\n            missing_checks = [\n                check_id\n                for check_id in self.REQUIRED_DETERMINISTIC_CHECK_IDS\n                if check_id not in succeeded_check_ids\n            ]\n            if missing_checks:\n                blockers.append(\n                    ReleaseBlocker(\n                        code="BOOKBENCH_REQUIRED_CHECKS_MISSING",\n                        detail="Required deterministic BookBench checks missing: "\n                        + ", ".join(missing_checks),\n                    )\n                )\n'''
          if old_evidence not in text:
              raise SystemExit('BookBench evidence anchor not found')
          lm.write_text(text.replace(old_evidence, new_evidence, 1))

          test = root / 'services/local-core/tests/test_literary_master.py'
          text = test.read_text()
          insert_anchor = '''        if bookbench_blocking:\n            connection.execute(\n'''
          extra = '''        deterministic_runs = (\n            ("deterministic.repetition", "IDEA_REPETITION"),\n            ("deterministic.statistics", "THOUGHT_DENSITY"),\n            ("deterministic.specificity", "SPECIFICITY_GENERICNESS"),\n            ("deterministic.evidence", "EVIDENCE_UNSUPPORTED_CLAIMS"),\n            ("deterministic.contract_structure", "CHAPTER_CONTRACT_FULFILLMENT"),\n            ("deterministic.ai_prose_pathology", "AI_PROSE_PATHOLOGY"),\n            ("deterministic.opening_ending_transition", "OPENING_ENDING_TRANSITION"),\n        )\n        for check_id, dimension in deterministic_runs:\n            connection.execute(\n                text(\n                    "INSERT INTO evaluation_runs("\n                    "evaluation_id,book_id,snapshot_id,check_id,check_version,registry_hash,dimension,"\n                    "evaluator_class,evaluator_id,evaluator_version,independence_state,input_hash,"\n                    "output_json,usage_json,latency_ms,status,created_at,completed_at) VALUES "\n                    "(:evaluation_id,:book_id,:snapshot_id,:check_id,'1.0.0',:registry_hash,:dimension,"\n                    "'DETERMINISTIC',:check_id,'1.0.0','NOT_APPLICABLE',:input_hash,"\n                    "'{}','{}',0,'SUCCEEDED',:now,:now)"\n                ),\n                {\n                    "evaluation_id": new_ulid(),\n                    "book_id": book_id,\n                    "snapshot_id": snapshot_id,\n                    "check_id": check_id,\n                    "registry_hash": "b" * 64,\n                    "dimension": dimension,\n                    "input_hash": "d" * 64,\n                    "now": now,\n                },\n            )\n\n'''
          if insert_anchor not in text:
              raise SystemExit('literary master test insert anchor not found')
          test.write_text(text.replace(insert_anchor, extra + insert_anchor, 1))
          PY
      - run: pip install ruff==0.12.11
      - run: |
          ruff format services/local-core/src/book_os_core/literary_master.py \
            services/local-core/tests/test_literary_master.py \
            services/local-core/tests/test_authority.py \
            services/local-core/tests/test_bookbench.py \
            services/local-core/tests/test_editorial.py \
            services/local-core/tests/test_memory.py \
            services/local-core/tests/test_projects.py \
            services/local-core/tests/test_research.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m9-hardening.yml
          git add services/local-core apps/desktop/src/LiteraryMasterPanel.tsx
          git commit -m 'M9: harden Literary Master release evidence gates'
          git push origin HEAD:brain/task-010-literary-master
