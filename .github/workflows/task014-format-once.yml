name: Task014 Format Once
on: push
permissions:
  contents: write
jobs:
  format:
    if: github.ref_name == 'brain/task-014-prose-anti-junk-panel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-014-prose-anti-junk-panel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.12.11
      - run: ruff format services/local-core/src/book_os_core/anti_junk.py services/local-core/src/book_os_core/bookbench_anti_junk.py services/local-core/src/book_os_core/launch_api.py services/local-core/src/book_os_core/model_gateway.py services/local-core/src/book_os_core/planning.py
      - run: |
          git config user.name "BOOK OS Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/task014-format-once.yml
          git add services/local-core/src/book_os_core
          git commit -m "Format Task014 Python changes"
          git push origin HEAD:brain/task-014-prose-anti-junk-panel
