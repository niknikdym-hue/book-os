name: M7 Core Hygiene
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/brain/task-008-bookbench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-008-bookbench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.12.11
      - name: Format M7 core and advance schema compatibility
        run: |
          ruff format \
            services/local-core/alembic/versions/0008_m7_bookbench.py \
            services/local-core/src/book_os_core/bookbench_registry.py \
            services/local-core/src/book_os_core/bookbench.py \
            services/local-core/tests/test_bookbench.py
          python - <<'PY'
          from pathlib import Path

          backup = Path('services/local-core/src/book_os_core/backup.py')
          source = backup.read_text(encoding='utf-8')
          old = 'SUPPORTED_ALEMBIC_REVISION = "0007"'
          if old not in source:
              raise SystemExit('backup schema 0007 not found')
          backup.write_text(source.replace(old, 'SUPPORTED_ALEMBIC_REVISION = "0008"', 1), encoding='utf-8')

          for path in (
              'services/local-core/tests/test_authority.py',
              'services/local-core/tests/test_backup_compat.py',
              'services/local-core/tests/test_core.py',
              'services/local-core/tests/test_projects.py',
              'services/local-core/tests/test_research.py',
              'services/local-core/tests/test_memory.py',
              'services/local-core/tests/test_editorial.py',
          ):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              text = text.replace('== "0007"', '== "0008"')
              text = text.replace('== ("0007",)', '== ("0008",)')
              file.write_text(text, encoding='utf-8')

          core = Path('services/local-core/tests/test_core.py')
          text = core.read_text(encoding='utf-8')
          if '            "0007",\n        }' in text:
              text = text.replace(
                  '            "0007",\n        }',
                  '            "0007",\n            "0008",\n        }',
                  1,
              )
          core.write_text(text, encoding='utf-8')
          PY
      - name: Remove helper and commit bounded hygiene
        run: |
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git rm .github/workflows/m7-core-hygiene.yml
          git add services/local-core/alembic/versions/0008_m7_bookbench.py services/local-core/src/book_os_core/bookbench_registry.py services/local-core/src/book_os_core/bookbench.py services/local-core/src/book_os_core/backup.py services/local-core/tests/test_bookbench.py services/local-core/tests/test_authority.py services/local-core/tests/test_backup_compat.py services/local-core/tests/test_core.py services/local-core/tests/test_projects.py services/local-core/tests/test_research.py services/local-core/tests/test_memory.py services/local-core/tests/test_editorial.py
          git commit -m "style: format M7 core and advance schema regressions"
          git push origin HEAD:brain/task-008-bookbench
