name: M2 Source Sync
on: [push]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: brain/task-003-book-creation-contracts }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r services/local-core/requirements-dev.lock
      - run: python .github/scripts/m2_source_sync.py
      - run: ruff format services/local-core
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add services/local-core apps/desktop/src/App.tsx
          git commit -m "fix: close M2 authority and regression gaps"
          git push origin HEAD:brain/task-003-book-creation-contracts
