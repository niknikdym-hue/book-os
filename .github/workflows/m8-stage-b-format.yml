name: M8 Stage B format once

on:
  push:
    branches:
      - brain/task-009-russia-provider-lane
    paths:
      - .github/workflows/m8-stage-b-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-009-russia-provider-lane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format Stage B files and remove helper
        run: |
          python -m pip install ruff==0.12.11
          cd services/local-core
          ruff format src/book_os_core/stage_b.py tests/test_stage_b.py
          cd ../..
          rm .github/workflows/m8-stage-b-format.yml
          git config user.name "BOOK OS Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add services/local-core/src/book_os_core/stage_b.py services/local-core/tests/test_stage_b.py .github/workflows/m8-stage-b-format.yml
          git commit -m "M8: format Stage B orchestration"
          git push origin HEAD:brain/task-009-russia-provider-lane
