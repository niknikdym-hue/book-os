name: M9 final fix once
on:
  push:
    branches: [brain/task-010-literary-master]
    paths:
      - '.github/workflows/m9-final-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-010-literary-master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          authority = Path('services/local-core/tests/test_authority.py')
          text = authority.read_text()
          old = 'assert connection.execute("SELECT version_num FROM alembic_version").fetchone() == ("0008",)'
          new = 'assert connection.execute("SELECT version_num FROM alembic_version").fetchone() == ("0009",)'
          if old not in text:
              raise SystemExit('authority schema assertion anchor not found')
          authority.write_text(text.replace(old, new, 1))

          desktop = Path('apps/desktop/src/LiteraryMasterPanel.test.tsx')
          text = desktop.read_text()
          old = '  expect(await screen.findByText(/Master:/)).toHaveTextContent("MASTER1");'
          new = '  expect(await screen.findByText("MASTER1")).toBeInTheDocument();'
          if old not in text:
              raise SystemExit('desktop assertion anchor not found')
          desktop.write_text(text.replace(old, new, 1))
          PY
      - run: pip install ruff==0.12.11
      - run: ruff format services/local-core/tests/test_authority.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m9-final-fix.yml
          git add services/local-core/tests/test_authority.py apps/desktop/src/LiteraryMasterPanel.test.tsx
          git commit -m 'fix: close final Literary Master test regressions'
          git push origin HEAD:brain/task-010-literary-master
