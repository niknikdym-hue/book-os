name: Task014 Wire Launch Once
on:
  push:
    paths:
      - '.github/workflows/task014-wire-launch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-014-prose-anti-junk-panel
      - name: Wire launch services and update current schema assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('services/local-core/src/book_os_core/app.py')
          text = app.read_text()
          anchor = 'from .authority import HumanApprovalRequired, ProposalStateError, StaleBaselineError\n'
          insert = anchor + 'from .anti_junk import AntiJunkService\n'
          assert anchor in text
          text = text.replace(anchor, insert, 1)

          anchor = 'from .drafting import DraftingError, DraftingGateError, DraftingService, DraftSectionRequest\n'
          insert = (
              'from .bookbench_anti_junk import AntiJunkBookBenchService\n'
              + anchor
              + 'from .launch_api import build_launch_router\n'
          )
          assert anchor in text
          text = text.replace(anchor, insert, 1)

          anchor = 'from .model_gateway import (\n'
          insert = 'from .model_gateway_anti_junk import AntiJunkModelGateway\n' + anchor
          assert anchor in text
          text = text.replace(anchor, insert, 1)

          old = '''    projects = ProjectService(configured_data_dir) if configured_data_dir is not None else None
    configured_gateway = gateway or ModelGateway(
        {"openai": OpenAIResponsesAdapter(MacOSKeychainSecretStore())}
    )
'''
          new = '''    projects = ProjectService(configured_data_dir) if configured_data_dir is not None else None
    anti_junk = AntiJunkService(configured_data_dir) if configured_data_dir is not None else None
    base_gateway = gateway or ModelGateway(
        {"openai": OpenAIResponsesAdapter(MacOSKeychainSecretStore())}
    )
    configured_gateway = (
        AntiJunkModelGateway(base_gateway, anti_junk) if anti_junk is not None else base_gateway
    )
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    bookbench = (
        BookBenchService(configured_data_dir, configured_embedding_gateway, configured_gateway)
        if configured_data_dir is not None
        else None
    )
'''
          new = '''    bookbench = (
        AntiJunkBookBenchService(
            configured_data_dir, configured_embedding_gateway, configured_gateway
        )
        if configured_data_dir is not None
        else None
    )
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    if configured_data_dir is not None:
        app.include_router(build_literary_master_router(configured_data_dir, require_token))
        app.include_router(build_pilot_router(configured_data_dir, require_token))
'''
          new = '''    if configured_data_dir is not None:
        app.include_router(build_literary_master_router(configured_data_dir, require_token))
        app.include_router(build_pilot_router(configured_data_dir, require_token))
        app.include_router(build_launch_router(configured_data_dir, require_token, configured_gateway))
'''
          assert old in text
          text = text.replace(old, new, 1)
          app.write_text(text)

          styles = Path('apps/desktop/src/styles.css')
          css = styles.read_text()
          css += '''\n.anti-junk-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin-top:16px}.anti-junk-list{margin-top:16px}.anti-junk-list summary{cursor:pointer;font-weight:700;color:#544f47}.anti-junk-entries{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:360px;overflow:auto}.anti-junk-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:#f7f4ed;border-radius:8px}.anti-junk-entry div{display:flex;flex-direction:column;gap:3px}.anti-junk-entry small{color:#797268}.paid-approval{display:flex;align-items:flex-start;gap:9px;margin-top:16px;padding:12px;border:1px solid #ded7ca;border-radius:9px;background:#faf7f1}.paid-approval input{margin-top:3px}.planning-step{margin-top:20px;padding-top:18px;border-top:1px solid #e3ded4}.planning-step h4{margin-bottom:10px}.planning-run{display:flex;flex-direction:column;gap:4px;margin:16px 0;padding:12px;background:#edf5ed;border-radius:9px}.planning-run small{overflow-wrap:anywhere}\n'''
          styles.write_text(css)

          for path in Path('services/local-core/tests').glob('test_*.py'):
              value = path.read_text()
              value = value.replace('== "0010"', '== "0011"')
              if path.name == 'test_core.py':
                  value = value.replace('            "0010",\n        }', '            "0010",\n            "0011",\n        }')
              path.write_text(value)

          Path('.github/workflows/task014-wire-launch.yml').unlink()
          PY
      - name: Commit wiring
        run: |
          git config user.name "BOOK OS Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Wire Russian launch planner and anti-junk runtime"
          git push origin HEAD:brain/task-014-prose-anti-junk-panel
