name: M5 Format Core
on: [push]
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/brain/task-006-book-memory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-006-book-memory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.12.11
      - run: |
          ruff format \
            services/local-core/alembic/versions/0006_m5_book_memory.py \
            services/local-core/src/book_os_core/memory.py \
            services/local-core/src/book_os_core/memory_embeddings.py \
            services/local-core/tests/test_memory.py \
            services/local-core/tests/test_memory_embeddings.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add services/local-core/alembic/versions/0006_m5_book_memory.py services/local-core/src/book_os_core/memory.py services/local-core/src/book_os_core/memory_embeddings.py services/local-core/tests/test_memory.py services/local-core/tests/test_memory_embeddings.py
          git commit -m "style: format initial M5 memory core"
          git push origin HEAD:brain/task-006-book-memory
