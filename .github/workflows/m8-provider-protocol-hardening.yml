name: M8 provider protocol hardening
on:
  push:
    branches: [brain/task-009-russia-provider-lane]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-009-russia-provider-lane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formatter
        run: python -m pip install ruff==0.12.11
      - name: Apply protocol hardening
        run: python tools/m8_provider_protocol_hardening.py
      - name: Format and lint changed sources
        run: |
          cd services/local-core
          ruff format src/book_os_core/provider_lane.py tests/test_provider_lane.py
          ruff check src/book_os_core/provider_lane.py tests/test_provider_lane.py
      - name: Self-clean and publish
        run: |
          rm .github/workflows/m8-provider-protocol-hardening.yml tools/m8_provider_protocol_hardening.py
          git config user.name niknikdym-hue
          git config user.email niknikdym@gmail.com
          git add -A
          git commit -m 'fix: align M8 adapters with current provider protocols'
          git push origin HEAD:brain/task-009-russia-provider-lane
