name: T02 Per-File Diagnostic

on:
  push:
    branches:
      - brain/agents-api-development-lane-20260914
    paths:
      - '.github/workflows/t02-per-file-diagnostic.yml'

permissions:
  contents: read

jobs:
  per-file:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve T02 patchers
        run: |
          cp tools/agents_api/apply_t02_evidence_claims.py /tmp/apply_t02.py
          cp tools/agents_api/apply_t02_test_semantics.py /tmp/apply_t02_test_semantics.py
      - name: Checkout and patch exact product candidate
        run: |
          git fetch origin codex/auto-book-complete-cycle-20260913
          git checkout -B product origin/codex/auto-book-complete-cycle-20260913
          test "$(git rev-parse HEAD)" = "e6ab40c14c9fae5ca76ab9b5e9235c43136378d0"
          python /tmp/apply_t02.py "$GITHUB_WORKSPACE"
          python /tmp/apply_t02_test_semantics.py "$GITHUB_WORKSPACE"
      - name: Install test dependencies
        working-directory: services/local-core
        run: pip install -q -r requirements-dev.lock
      - name: Run each test file with hard timeout
        working-directory: services/local-core
        run: |
          set -o pipefail
          failed=0
          for f in $(find tests -maxdepth 1 -name 'test_*.py' | sort); do
            echo "=== $f ==="
            if timeout 45s python -m pytest -q "$f"; then
              echo "PASS $f"
            else
              rc=$?
              echo "FAIL_OR_TIMEOUT rc=$rc $f"
              failed=1
            fi
          done
          exit "$failed"
