name: M9 wire API once
on:
  push:
    branches: [brain/task-010-literary-master]
    paths:
      - '.github/workflows/m9-wire-api.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-010-literary-master
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/local-core/src/book_os_core/app.py')
          text = path.read_text()
          anchor = 'from .editorial_diagnostics import EditorialDiagnostics\n'
          addition = anchor + 'from .literary_master_api import build_literary_master_router\n'
          if 'from .literary_master_api import build_literary_master_router' not in text:
              text = text.replace(anchor, addition, 1)
          anchor2 = '''    def require_token(authorization: str | None = Header(default=None)) -> None:\n        if (\n            authorization is None\n            or not authorization.startswith("Bearer ")\n            or not hmac.compare_digest(authorization[7:], expected)\n        ):\n            raise HTTPException(status_code=status.HTTP_401_UNAUTHORIZED, detail="unauthorized")\n'''
          addition2 = anchor2 + '''\n    if configured_data_dir is not None:\n        app.include_router(build_literary_master_router(configured_data_dir, require_token))\n'''
          if 'app.include_router(build_literary_master_router' not in text:
              if anchor2 not in text:
                  raise SystemExit('require_token anchor not found')
              text = text.replace(anchor2, addition2, 1)
          path.write_text(text)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.12.11
      - run: ruff format services/local-core/src/book_os_core/app.py services/local-core/src/book_os_core/literary_master_api.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m9-wire-api.yml
          git add services/local-core/src/book_os_core/app.py services/local-core/src/book_os_core/literary_master_api.py
          git commit -m 'M9: wire Literary Master API into Local Core'
          git push origin HEAD:brain/task-010-literary-master
