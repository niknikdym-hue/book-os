name: Task 020 Writer Admission Repair
on:
  push:
    branches:
      - codex/task-020-implementation-20260909
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Run Task 020 writer admission repair v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/task-020-implementation-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local-core dependencies
        working-directory: services/local-core
        run: pip install -r requirements-dev.lock
      - name: Apply Writer admission repair
        run: python .github/task020_writer_gate_repair.py
      - name: Validate full backend
        working-directory: services/local-core
        run: |
          ruff format .
          ruff check .
          mypy src
          pytest -q
      - name: Commit verified repair and remove temporary files
        shell: bash
        run: |
          rm -f .github/task020_writer_gate_repair.py
          rm -f .github/workflows/task020-writer-gate-repair.yml
          git diff --check
          git config user.name 'book-os-ci'
          git config user.email 'book-os-ci@users.noreply.github.com'
          git add -A
          git commit -m 'Task 020: enforce Task 017 admission before Writer routing'
          git push origin HEAD:codex/task-020-implementation-20260909
