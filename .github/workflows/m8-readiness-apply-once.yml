name: M8 readiness apply once

on:
  push:
    branches:
      - brain/task-009-russia-provider-lane
    paths:
      - .github/workflows/m8-readiness-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-009-russia-provider-lane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/m8_readiness_patch.py
      - run: python -m pip install ruff==0.12.11
      - run: cd services/local-core && ruff format src/book_os_core/app.py tests/test_provider_readiness.py && ruff check src/book_os_core/app.py tests/test_provider_readiness.py
      - run: rm .github/scripts/m8_readiness_patch.py .github/workflows/m8-readiness-apply-once.yml
      - run: git config user.name "BOOK OS Central Brain" && git config user.email "actions@users.noreply.github.com" && git add services/local-core/src/book_os_core/app.py services/local-core/tests/test_provider_readiness.py .github/scripts/m8_readiness_patch.py .github/workflows/m8-readiness-apply-once.yml && git commit -m "M8: clarify runtime and evaluator readiness semantics" && git push origin HEAD:brain/task-009-russia-provider-lane
