          Path('docs/PROJECT_STATE.md').write_text(state, encoding='utf-8')

          manifest = Path('docs/DESIGN_FILE_HASHES.sha256')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          ordered: list[str] = []
          hashes: dict[str, str] = {}
          for line in lines:
              if not line.strip():
                  continue
              digest, path = line.split('  ', 1)
              ordered.append(path)
              hashes[path] = digest
          for path in ('docs/PROJECT_STATE.md', 'docs/tasks/CODEX_TASK_008_BOOKBENCH.md'):
              hashes[path] = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if path not in ordered:
                  ordered.append(path)
          manifest.write_text(
              ''.join(f'{hashes[path]}  {path}\n' for path in ordered),
              encoding='utf-8',
          )
          PY
