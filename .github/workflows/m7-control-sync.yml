## Active implementation task — M7

`Task 008 — BookBench v0.1`

M7 implements versioned internal evaluation against exact revisions:

`exact snapshot → deterministic/semantic/judge/pairwise checks → EvaluationRun → actionable findings/report → optional explicit Editorial Inbox handoff`.

Core rules:

- BookBench is derived diagnostic state, never authority;
- there is **no single magic overall book/model score**;
- every run stores exact target revisions/hashes and check/rubric/evaluator version/config;
- findings carry exact location/evidence/severity/confidence/recommended action;
- deterministic signals do not masquerade as semantic truth;
- semantic similarity does not prove contradiction/factual truth;
- AI-prose pathology reports measured patterns/locations, never authorship probability;
- Author Voice Fingerprint is versioned diagnostic state from explicit exact reference revisions;
- LLM judge/pairwise reuses the existing provider-neutral Model Gateway and normal CI remains fake/mocked with zero paid calls;
- same writer/judge configuration is explicitly non-independent;
- private evaluation/decision datasets stay in project SQLite.

## Scope guard

Do not implement yet:

- M8 Yandex/GigaChat/Russia-ready provider lane or provider production promotion;
- Literary Master/export/audio handoff;
- cloud/accounts/billing/sync;
- bestseller prediction or one universal BookBench score;
- automatic manuscript rewrite/authority mutation from evals;
- hidden LLM judge authority;
- remote vector database/ANN dependency.

## Next permitted action

1. Use this synchronized state/hash commit as the exact implementation baseline.
2. Create `brain/task-008-bookbench` from exact `main` HEAD.
3. Implement only `docs/tasks/CODEX_TASK_008_BOOKBENCH.md`.
4. Open one PR, fix objective CI/acceptance blockers, then Central Brain ACCEPT + merge M7.
5. Only then start M8 Russia-ready/no-VPN provider lane.

## Known blockers

No Owner decision blocker for bounded M7. A required paid/live judge, magic global score, BookBench authority mutation, hidden same-config dependence, private dataset publication or M8 scope are stop conditions.

## Operational rule

`main` is accepted project-development authority. Implementation code uses bounded branches/PRs. Central Brain may make small project-control updates directly to `main` when a separate PR adds no review value.

