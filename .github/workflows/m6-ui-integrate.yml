name: M6 UI Integrate
on: [push]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/brain/task-007-editorial-workflows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-007-editorial-workflows
      - name: Integrate EditorialPanel into workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/App.tsx')
          source = path.read_text(encoding='utf-8')
          old_import = 'import { DraftingPanel } from "./DraftingPanel";\n'
          new_import = 'import { DraftingPanel } from "./DraftingPanel";\nimport { EditorialPanel } from "./EditorialPanel";\n'
          if old_import not in source:
              raise SystemExit('DraftingPanel import not found')
          source = source.replace(old_import, new_import, 1)
          old_render = '              <BookMemoryPanel project={project} chapter={selectedChapter} />\n'
          new_render = (
              '              <BookMemoryPanel project={project} chapter={selectedChapter} />\n'
              '              <EditorialPanel project={project} chapter={selectedChapter} />\n'
          )
          if old_render not in source:
              raise SystemExit('BookMemoryPanel render not found')
          path.write_text(source.replace(old_render, new_render, 1), encoding='utf-8')
          PY
      - name: Remove helper and commit UI integration
        run: |
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git rm .github/workflows/m6-ui-integrate.yml
          git add apps/desktop/src/App.tsx
          git commit -m "feat: integrate M6 Editorial Decision Inbox"
          git push origin HEAD:brain/task-007-editorial-workflows
