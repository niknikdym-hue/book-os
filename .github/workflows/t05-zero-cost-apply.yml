name: T05 Zero-Cost Apply

on:
  push:
    branches: [brain/agents-api-development-lane-20260914]
    paths:
      - '.github/workflows/t05-zero-cost-apply.yml'
      - 'tools/agents_api/apply_t05_series_uniqueness.py'
      - 'tools/agents_api/apply_t05b_universal_series.py'
      - 'tools/agents_api/apply_t05c_red_regressions.py'
      - 'tools/agents_api/apply_t05d_indexed_semantic_pairs.py'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preserve T05 patchers
        run: |
          cp tools/agents_api/apply_t05b_universal_series.py /tmp/apply_t05b.py
          cp tools/agents_api/apply_t05c_red_regressions.py /tmp/apply_t05c.py
          cp tools/agents_api/apply_t05d_indexed_semantic_pairs.py /tmp/apply_t05d.py
      - name: Checkout exact product candidate
        run: |
          git fetch origin codex/auto-book-complete-cycle-20260913
          git checkout -B codex/auto-book-complete-cycle-20260913 origin/codex/auto-book-complete-cycle-20260913
          test "$(git rev-parse HEAD)" = "98c0eaf51a4b96c10e0c2e20a3d8a6c2d49a230c"
      - name: Apply T05 F08 universal hardening
        run: |
          python /tmp/apply_t05b.py "$GITHUB_WORKSPACE"
          python /tmp/apply_t05c.py "$GITHUB_WORKSPACE"
          python /tmp/apply_t05d.py "$GITHUB_WORKSPACE"
          git diff --check
      - name: Install dependencies
        working-directory: services/local-core
        run: pip install -q -r requirements-dev.lock
      - name: Format/Ruff/Mypy
        working-directory: services/local-core
        run: |
          ruff format \
            src/book_os_core/series_similarity.py \
            src/book_os_core/series_workspace.py \
            src/book_os_core/series_workspace_base.py \
            tests/test_series_semantic_overlap.py
          ruff check .
          mypy src
      - name: Targeted T05 regressions
        working-directory: services/local-core
        run: |
          pytest -q \
            tests/test_series_semantic_overlap.py \
            tests/test_series_studio.py \
            tests/test_series_workspace.py \
            tests/test_series_governance_completion.py \
            tests/test_series_map_freshness.py \
            tests/test_support_task017.py
      - name: Full Local Core pytest
        working-directory: services/local-core
        run: pytest
      - name: Commit to existing PR 38 branch
        run: |
          git diff --check
          git config user.name 'BOOK OS Central Brain'
          git config user.email 'central-brain@invalid'
          git add \
            services/local-core/src/book_os_core/series_similarity.py \
            services/local-core/src/book_os_core/series_workspace.py \
            services/local-core/src/book_os_core/series_workspace_base.py \
            services/local-core/tests/test_series_semantic_overlap.py
          git commit -m 'Generalize series uniqueness and human exception gates'
          git push origin HEAD:codex/auto-book-complete-cycle-20260913
