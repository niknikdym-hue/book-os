name: M7 Recovery Transport

on:
  push:
    branches:
      - brain/task-008-bookbench

permissions:
  contents: write
  issues: read

concurrency:
  group: m7-recovery-transport
  cancel-in-progress: false

jobs:
  apply-verified-recovery-slice:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: brain/task-008-bookbench
          fetch-depth: 0
          persist-credentials: true

      - name: Verify baseline and fetch transport artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: 198455286335e9a0ea5203d2497449fe282d5102
          COMMENT_ID: "5427446407"
          EXPECTED_GZIP_SHA256: 6c26523ac13d2e0f0313dbe324b421529d7f28758b3c172968cac8e3e0a63f04
          EXPECTED_RAW_SHA256: d90dfb0b98da2ac9c9bd9863a1293e9ebd6c5bf8c13d688018af4ad8a3a31a48
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
            | jq -r '.body' > /tmp/m7-comment.txt
          awk '/^BEGIN_M7_RECOVERY_PATCH_GZ_BASE64$/{capture=1;next}/^END_M7_RECOVERY_PATCH_GZ_BASE64$/{capture=0}capture' \
            /tmp/m7-comment.txt | tr -d '[:space:]' > /tmp/m7.patch.gz.b64
          test -s /tmp/m7.patch.gz.b64
          base64 --decode /tmp/m7.patch.gz.b64 > /tmp/m7.patch.gz
          echo "$EXPECTED_GZIP_SHA256  /tmp/m7.patch.gz" | sha256sum --check --strict
          gzip -dc /tmp/m7.patch.gz > /tmp/m7.patch
          echo "$EXPECTED_RAW_SHA256  /tmp/m7.patch" | sha256sum --check --strict
          test "$(wc -c < /tmp/m7.patch)" -eq 34015

      - name: Restrict and apply byte-exact patch
        run: |
          set -euo pipefail
          grep '^diff --git a/' /tmp/m7.patch | sed -E 's#^diff --git a/([^ ]+) b/.*#\1#' | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          docs/DESIGN_FILE_HASHES.sha256
          docs/PROJECT_STATE.md
          services/local-core/src/book_os_core/app.py
          services/local-core/src/book_os_core/bookbench.py
          services/local-core/src/book_os_core/model_gateway.py
          services/local-core/src/book_os_core/prompts.py
          services/local-core/tests/test_bookbench.py
          services/local-core/tests/test_model_gateway.py
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git apply --check /tmp/m7.patch
          git apply /tmp/m7.patch
          git diff --check

      - name: Commit verified slice and remove transport workflow
        run: |
          set -euo pipefail
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git rm .github/workflows/m7-recovery-transport.yml
          git add docs services
          git commit -m "feat: recover M7 voice and judge foundations"
          git push origin HEAD:brain/task-008-bookbench
