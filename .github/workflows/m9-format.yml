name: M9 format once
on:
  push:
    branches: [brain/task-010-literary-master]
    paths:
      - '.github/workflows/m9-format.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-010-literary-master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.12.11
      - run: |
          ruff format services/local-core/src/book_os_core/literary_master.py \
            services/local-core/tests/test_literary_master.py \
            services/local-core/alembic/versions/0009_m9_literary_master.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m9-format.yml
          git add services/local-core/src/book_os_core/literary_master.py \
            services/local-core/tests/test_literary_master.py \
            services/local-core/alembic/versions/0009_m9_literary_master.py
          git commit -m 'style: format M9 Literary Master backend'
          git push origin HEAD:brain/task-010-literary-master
