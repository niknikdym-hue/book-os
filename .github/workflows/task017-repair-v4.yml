name: Task 017 Fixture Repair v4
on:
  push:
    branches:
      - brain/task-017-series-production-gates
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Run Task 017 fixture repair v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-017-series-production-gates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local-core dependencies
        working-directory: services/local-core
        run: pip install -r requirements-dev.lock
      - name: Apply Task 017 fixture and schema assertion repairs
        run: |
          python .github/task017_fixture_repair.py
          python .github/task017_schema_fix.py
      - name: Format and validate full backend
        id: validate
        working-directory: services/local-core
        shell: bash
        run: |
          set +e
          ruff format . 2>&1 | tee repair-format.txt
          format_status=${PIPESTATUS[0]}
          ruff check . 2>&1 | tee repair-ruff.txt
          ruff_status=${PIPESTATUS[0]}
          mypy src 2>&1 | tee repair-mypy.txt
          mypy_status=${PIPESTATUS[0]}
          pytest -q 2>&1 | tee repair-pytest.txt
          pytest_status=${PIPESTATUS[0]}
          printf 'format=%s\nruff=%s\nmypy=%s\npytest=%s\n' "$format_status" "$ruff_status" "$mypy_status" "$pytest_status" | tee repair-status.txt
          if [ "$format_status" -eq 0 ] && [ "$ruff_status" -eq 0 ] && [ "$mypy_status" -eq 0 ] && [ "$pytest_status" -eq 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task017-fixture-repair-v4-diagnostic
          path: |
            services/local-core/repair-format.txt
            services/local-core/repair-ruff.txt
            services/local-core/repair-mypy.txt
            services/local-core/repair-pytest.txt
            services/local-core/repair-status.txt
          if-no-files-found: warn
      - name: Commit verified repair and remove temporary files
        if: steps.validate.outputs.ok == 'true'
        shell: bash
        run: |
          rm -f .github/task017_fixture_repair.py
          rm -f .github/task017_schema_fix.py
          rm -f .github/workflows/pytest-diagnostic.yml
          rm -f .github/workflows/task017-repair-v2.yml
          rm -f .github/workflows/task017-repair-v3.yml
          rm -f .github/workflows/task017-repair-v4.yml
          rm -f services/local-core/repair-format.txt services/local-core/repair-ruff.txt services/local-core/repair-mypy.txt services/local-core/repair-pytest.txt services/local-core/repair-status.txt
          git diff --check
          git config user.name 'book-os-ci'
          git config user.email 'book-os-ci@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Task 017 historical test fixtures'
          git push origin HEAD:brain/task-017-series-production-gates
