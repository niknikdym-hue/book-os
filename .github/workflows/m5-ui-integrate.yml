name: M5 UI Integrate
on: [push]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/brain/task-006-book-memory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-006-book-memory
      - name: Integrate Book Memory panel into workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/App.tsx')
          source = path.read_text(encoding='utf-8')
          old_import = 'import { DraftingPanel } from "./DraftingPanel";\n'
          new_import = 'import { BookMemoryPanel } from "./BookMemoryPanel";\nimport { DraftingPanel } from "./DraftingPanel";\n'
          if old_import not in source:
              raise SystemExit('DraftingPanel import not found')
          source = source.replace(old_import, new_import, 1)
          old_render = '              <ResearchPanel project={project} chapter={selectedChapter} />\n'
          new_render = (
              '              <ResearchPanel project={project} chapter={selectedChapter} />\n'
              '              <BookMemoryPanel project={project} chapter={selectedChapter} />\n'
          )
          if old_render not in source:
              raise SystemExit('ResearchPanel render not found')
          path.write_text(source.replace(old_render, new_render, 1), encoding='utf-8')
          PY
      - name: Remove helper and commit UI integration
        run: |
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git rm .github/workflows/m5-ui-integrate.yml
          git add apps/desktop/src/App.tsx
          git commit -m "feat: integrate M5 Book Memory workspace"
          git push origin HEAD:brain/task-006-book-memory
