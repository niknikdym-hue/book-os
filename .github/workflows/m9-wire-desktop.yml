name: M9 wire desktop once
on:
  push:
    branches: [brain/task-010-literary-master]
    paths:
      - '.github/workflows/m9-wire-desktop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-010-literary-master
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/App.tsx')
          text = path.read_text()
          anchor = 'import { EditorialPanel } from "./EditorialPanel";\n'
          addition = anchor + 'import { LiteraryMasterPanel } from "./LiteraryMasterPanel";\n'
          if 'import { LiteraryMasterPanel }' not in text:
              text = text.replace(anchor, addition, 1)
          anchor2 = '              <BookBenchPanel project={project} />\n'
          addition2 = anchor2 + '              <LiteraryMasterPanel project={project} />\n'
          if '<LiteraryMasterPanel project={project} />' not in text:
              if anchor2 not in text:
                  raise SystemExit('BookBenchPanel anchor not found')
              text = text.replace(anchor2, addition2, 1)
          path.write_text(text)
          PY
      - run: |
          cd apps/desktop
          corepack enable
          pnpm install --frozen-lockfile --prod=false
          pnpm exec prettier --write src/App.tsx src/LiteraryMasterPanel.tsx src/LiteraryMasterPanel.test.tsx || true
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m9-wire-desktop.yml
          git add apps/desktop/src/App.tsx apps/desktop/src/LiteraryMasterPanel.tsx apps/desktop/src/LiteraryMasterPanel.test.tsx
          git commit -m 'M9: wire Literary Master panel into desktop'
          git push origin HEAD:brain/task-010-literary-master
