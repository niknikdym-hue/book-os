name: Pilot final hardening once
on:
  push:
    branches: [brain/task-011-real-book-pilot]
    paths:
      - '.github/workflows/pilot-final-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-011-real-book-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path

          pilot = Path('services/local-core/src/book_os_core/pilot.py')
          text = pilot.read_text()
          if 'import hashlib\n' not in text:
              text = text.replace('from collections import Counter\n', 'from collections import Counter\nimport hashlib\n', 1)

          old_view = '''class OpenAIPreflightView(BaseModel):\n    provider: str = "openai"\n    credential_state: Literal["AVAILABLE", "NOT_AVAILABLE"]\n    writer_model: str\n    evaluator_model: str\n    editor_lane: str\n    external_calls: int = 0\n    paid_calls: int = 0\n'''
          new_view = '''class OpenAIPreflightView(BaseModel):\n    provider: str = "openai"\n    credential_state: Literal["AVAILABLE", "NOT_AVAILABLE"]\n    writer_model: str\n    evaluator_model: str\n    editor_lane: str\n    max_requests: int\n    max_input_tokens: int\n    max_output_tokens: int\n    max_cost_usd: float | None\n    plan_hash: str\n    external_calls: int = 0\n    paid_calls: int = 0\n'''
          if old_view not in text:
              raise SystemExit('OpenAIPreflightView anchor missing')
          text = text.replace(old_view, new_view, 1)

          event_anchor = '''        if payload.event_kind == "NOT_APPLICABLE" or payload.outcome == "NOT_APPLICABLE":\n            reason = payload.metadata.get("reason")\n            if not isinstance(reason, str) or not reason.strip():\n                raise PilotGateError("NOT_APPLICABLE stage evidence requires a reason")\n'''
          event_new = event_anchor + '''        human_detail_keys = {\n            "HUMAN_REVIEW": "reason",\n            "LITERARY_QUALITY_JUDGMENT": "judgment",\n            "DEFECT_REVIEW": "reason",\n        }\n        detail_key = human_detail_keys.get(payload.event_kind)\n        if detail_key is not None:\n            if payload.actor_kind != "HUMAN":\n                raise PilotGateError(f"{payload.event_kind} stage evidence must be HUMAN")\n            detail = payload.metadata.get(detail_key)\n            if not isinstance(detail, str) or not detail.strip():\n                raise PilotGateError(\n                    f"{payload.event_kind} stage evidence requires nonblank {detail_key}"\n                )\n'''
          if event_anchor not in text:
              raise SystemExit('stage event validation anchor missing')
          text = text.replace(event_anchor, event_new, 1)

          resolve_anchor = '''                if row["resolved_at"] is not None:\n                    raise PilotGateError("pilot observation is already resolved")\n                resolved_at = utc_now()\n'''
          resolve_new = '''                if row["resolved_at"] is not None:\n                    raise PilotGateError("pilot observation is already resolved")\n                if str(row["severity"]) == "BLOCKING" and actor_kind != "HUMAN":\n                    raise PilotGateError("BLOCKING pilot observation requires HUMAN resolution")\n                resolved_at = utc_now()\n'''
          if resolve_anchor not in text:
              raise SystemExit('resolve observation anchor missing')
          text = text.replace(resolve_anchor, resolve_new, 1)

          preflight_start = text.index('    @staticmethod\n    def openai_preflight(')
          preflight_end = text.index('\n    def summary(', preflight_start)
          new_preflight = '''    @staticmethod\n    def openai_preflight(\n        secrets: SecretStore,\n        *,\n        writer_model: str,\n        evaluator_model: str,\n        editor_lane: str = "deterministic-m6-current",\n        max_requests: int,\n        max_input_tokens: int,\n        max_output_tokens: int,\n        max_cost_usd: float | None = None,\n    ) -> OpenAIPreflightView:\n        if not writer_model.strip() or not evaluator_model.strip() or not editor_lane.strip():\n            raise PilotGateError("OpenAI preflight requires explicit model/config identities")\n        if min(max_requests, max_input_tokens, max_output_tokens) <= 0:\n            raise PilotGateError("OpenAI preflight requires positive request/token bounds")\n        if max_cost_usd is not None and max_cost_usd < 0:\n            raise PilotGateError("OpenAI preflight cost bound cannot be negative")\n        try:\n            secrets.get_secret("openai_api_key")\n        except Exception:\n            credential_state: Literal["AVAILABLE", "NOT_AVAILABLE"] = "NOT_AVAILABLE"\n        else:\n            credential_state = "AVAILABLE"\n        plan = {\n            "provider": "openai",\n            "writer_model": writer_model.strip(),\n            "evaluator_model": evaluator_model.strip(),\n            "editor_lane": editor_lane.strip(),\n            "max_requests": max_requests,\n            "max_input_tokens": max_input_tokens,\n            "max_output_tokens": max_output_tokens,\n            "max_cost_usd": max_cost_usd,\n        }\n        plan_hash = hashlib.sha256(\n            json.dumps(plan, sort_keys=True, separators=(",", ":")).encode("utf-8")\n        ).hexdigest()\n        return OpenAIPreflightView(\n            credential_state=credential_state,\n            plan_hash=plan_hash,\n            **plan,\n        )\n'''
          text = text[:preflight_start] + new_preflight + text[preflight_end:]

          old_master_query = '''                            "SELECT master_id,manifest_hash FROM literary_masters "\n                            "WHERE book_id=:book_id AND status='LOCKED' AND created_at>=:started_at "\n'''
          new_master_query = '''                            "SELECT master_id,manifest_hash,manifest_json FROM literary_masters "\n                            "WHERE book_id=:book_id AND status='LOCKED' AND created_at>=:started_at "\n'''
          if old_master_query not in text:
              raise SystemExit('master query anchor missing')
          text = text.replace(old_master_query, new_master_query, 1)

          master_values = '''                master_id = str(master["master_id"]) if master is not None else None\n                master_hash = str(master["manifest_hash"]) if master is not None else None\n'''
          master_values_new = master_values + '''                master_snapshot_id: str | None = None\n                if master is not None:\n                    manifest = json.loads(str(master["manifest_json"]))\n                    bookbench = manifest.get("bookbench") if isinstance(manifest, dict) else None\n                    if isinstance(bookbench, dict) and bookbench.get("snapshot_id") is not None:\n                        master_snapshot_id = str(bookbench["snapshot_id"])\n'''
          if master_values not in text:
              raise SystemExit('master values anchor missing')
          text = text.replace(master_values, master_values_new, 1)

          blocker_anchor = '''                if snapshot_id is None:\n                    blockers.append("BOOKBENCH_SNAPSHOT_MISSING")\n                elif bookbench_blocking:\n                    blockers.append(f"BOOKBENCH_BLOCKING:{bookbench_blocking}")\n'''
          blocker_new = blocker_anchor + '''                if master_id is not None and master_snapshot_id != snapshot_id:\n                    blockers.append("BOOKBENCH_MASTER_MISMATCH")\n'''
          if blocker_anchor not in text:
              raise SystemExit('BookBench blocker anchor missing')
          text = text.replace(blocker_anchor, blocker_new, 1)
          pilot.write_text(text)

          api = Path('services/local-core/src/book_os_core/pilot_api.py')
          text = api.read_text()
          old_request = '''class OpenAIPreflightRequest(BaseModel):\n    writer_model: str = Field(min_length=1, max_length=128)\n    evaluator_model: str = Field(min_length=1, max_length=128)\n    editor_lane: str = Field(default="deterministic-m6-current", min_length=1, max_length=128)\n'''
          new_request = '''class OpenAIPreflightRequest(BaseModel):\n    writer_model: str = Field(min_length=1, max_length=128)\n    evaluator_model: str = Field(min_length=1, max_length=128)\n    editor_lane: str = Field(default="deterministic-m6-current", min_length=1, max_length=128)\n    max_requests: int = Field(gt=0)\n    max_input_tokens: int = Field(gt=0)\n    max_output_tokens: int = Field(gt=0)\n    max_cost_usd: float | None = Field(default=None, ge=0)\n'''
          if old_request not in text:
              raise SystemExit('API preflight request anchor missing')
          text = text.replace(old_request, new_request, 1)
          call_anchor = '''                writer_model=payload.writer_model,\n                evaluator_model=payload.evaluator_model,\n                editor_lane=payload.editor_lane,\n'''
          call_new = call_anchor + '''                max_requests=payload.max_requests,\n                max_input_tokens=payload.max_input_tokens,\n                max_output_tokens=payload.max_output_tokens,\n                max_cost_usd=payload.max_cost_usd,\n'''
          if call_anchor not in text:
              raise SystemExit('API preflight call anchor missing')
          api.write_text(text.replace(call_anchor, call_new, 1))

          panel = Path('apps/desktop/src/PilotPanel.tsx')
          text = panel.read_text()
          type_anchor = '''  editor_lane: string;\n  external_calls: number;\n  paid_calls: number;\n};\n'''
          type_new = '''  editor_lane: string;\n  max_requests: number;\n  max_input_tokens: number;\n  max_output_tokens: number;\n  max_cost_usd: number | null;\n  plan_hash: string;\n  external_calls: number;\n  paid_calls: number;\n};\n'''
          if type_anchor not in text:
              raise SystemExit('desktop preflight type anchor missing')
          text = text.replace(type_anchor, type_new, 1)
          state_anchor = '''  const [writerModel, setWriterModel] = useState("");\n  const [evaluatorModel, setEvaluatorModel] = useState("");\n'''
          state_new = state_anchor + '''  const [maxRequests, setMaxRequests] = useState("");\n  const [maxInputTokens, setMaxInputTokens] = useState("");\n  const [maxOutputTokens, setMaxOutputTokens] = useState("");\n  const [maxCostUsd, setMaxCostUsd] = useState("");\n  const [reviewNote, setReviewNote] = useState("");\n'''
          if state_anchor not in text:
              raise SystemExit('desktop state anchor missing')
          text = text.replace(state_anchor, state_new, 1)
          check_start = text.index('  async function checkOpenAI()')
          check_end = text.index('\n  async function recordFinalDecision()', check_start)
          new_check = '''  async function checkOpenAI() {\n    const requests = Number(maxRequests);\n    const inputTokens = Number(maxInputTokens);\n    const outputTokens = Number(maxOutputTokens);\n    const cost = maxCostUsd.trim() ? Number(maxCostUsd) : null;\n    if (\n      !pilot ||\n      !writerModel.trim() ||\n      !evaluatorModel.trim() ||\n      !Number.isInteger(requests) ||\n      requests <= 0 ||\n      !Number.isInteger(inputTokens) ||\n      inputTokens <= 0 ||\n      !Number.isInteger(outputTokens) ||\n      outputTokens <= 0 ||\n      (cost !== null && (!Number.isFinite(cost) || cost < 0))\n    )\n      return;\n    setBusy(true);\n    setError(null);\n    try {\n      setPreflight(\n        await coreApi<OpenAIPreflight>(\n          "POST",\n          `/api/projects/${project.book_id}/pilots/${pilot.pilot_id}/openai-preflight`,\n          {\n            writer_model: writerModel.trim(),\n            evaluator_model: evaluatorModel.trim(),\n            editor_lane: "deterministic-m6-current",\n            max_requests: requests,\n            max_input_tokens: inputTokens,\n            max_output_tokens: outputTokens,\n            max_cost_usd: cost,\n          },\n        ),\n      );\n    } catch (reason) {\n      setError(String(reason));\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  async function recordHumanReview(kind: "DEFECT_REVIEW" | "LITERARY_QUALITY_JUDGMENT") {\n    if (!pilot || !humanActor.trim() || !reviewNote.trim()) return;\n    setBusy(true);\n    setError(null);\n    try {\n      await coreApi(\n        "POST",\n        `/api/projects/${project.book_id}/pilots/${pilot.pilot_id}/stage-events`,\n        {\n          stage: kind === "DEFECT_REVIEW" ? "BOOKBENCH" : "FINAL_REVIEW",\n          event_kind: kind,\n          actor: humanActor.trim(),\n          actor_kind: "HUMAN",\n          outcome: "SUCCESS",\n          metadata:\n            kind === "DEFECT_REVIEW"\n              ? { reason: reviewNote.trim() }\n              : { judgment: reviewNote.trim() },\n        },\n      );\n      setReviewNote("");\n      await refresh();\n    } catch (reason) {\n      setError(String(reason));\n    } finally {\n      setBusy(false);\n    }\n  }\n'''
          text = text[:check_start] + new_check + text[check_end:]

          evaluator_input = '''                <label className="field">\n                  <span>Evaluator model</span>\n                  <input value={evaluatorModel} onChange={(event) => setEvaluatorModel(event.target.value)} />\n                </label>\n'''
          bound_inputs = evaluator_input + '''                <label className="field">\n                  <span>Max requests</span>\n                  <input inputMode="numeric" value={maxRequests} onChange={(event) => setMaxRequests(event.target.value)} />\n                </label>\n                <label className="field">\n                  <span>Max input tokens</span>\n                  <input inputMode="numeric" value={maxInputTokens} onChange={(event) => setMaxInputTokens(event.target.value)} />\n                </label>\n                <label className="field">\n                  <span>Max output tokens</span>\n                  <input inputMode="numeric" value={maxOutputTokens} onChange={(event) => setMaxOutputTokens(event.target.value)} />\n                </label>\n                <label className="field">\n                  <span>Max cost USD (optional)</span>\n                  <input inputMode="decimal" value={maxCostUsd} onChange={(event) => setMaxCostUsd(event.target.value)} />\n                </label>\n'''
          if evaluator_input not in text:
              raise SystemExit('desktop evaluator input anchor missing')
          text = text.replace(evaluator_input, bound_inputs, 1)
          disabled_old = 'disabled={busy || !writerModel.trim() || !evaluatorModel.trim()}'
          disabled_new = 'disabled={busy || !writerModel.trim() || !evaluatorModel.trim() || !maxRequests.trim() || !maxInputTokens.trim() || !maxOutputTokens.trim()}'
          text = text.replace(disabled_old, disabled_new, 1)
          preflight_text = '''                    OpenAI credential: <strong>{preflight.credential_state}</strong> · external calls: {preflight.external_calls} · paid calls: {preflight.paid_calls}\n'''
          preflight_new = '''                    OpenAI credential: <strong>{preflight.credential_state}</strong> · plan {preflight.plan_hash.slice(0, 16)}… · requests ≤ {preflight.max_requests} · input tokens ≤ {preflight.max_input_tokens} · output tokens ≤ {preflight.max_output_tokens} · cost cap {preflight.max_cost_usd ?? "unset"} · external calls: {preflight.external_calls} · paid calls: {preflight.paid_calls}\n'''
          if preflight_text not in text:
              raise SystemExit('desktop preflight display anchor missing')
          text = text.replace(preflight_text, preflight_new, 1)

          review_anchor = '''              <div className="form-grid" aria-label="OpenAI zero-call preflight">\n'''
          review_block = '''              <div className="form-grid" aria-label="Human pilot reviews">\n                <label className="field">\n                  <span>Human review note</span>\n                  <textarea value={reviewNote} onChange={(event) => setReviewNote(event.target.value)} />\n                </label>\n                <div className="actions">\n                  <button className="secondary" onClick={() => void recordHumanReview("DEFECT_REVIEW")} disabled={busy || !humanActor.trim() || !reviewNote.trim()}>\n                    Record BookBench defect review\n                  </button>\n                  <button className="secondary" onClick={() => void recordHumanReview("LITERARY_QUALITY_JUDGMENT")} disabled={busy || !humanActor.trim() || !reviewNote.trim()}>\n                    Record literary quality judgment\n                  </button>\n                </div>\n              </div>\n\n'''
          if review_anchor not in text:
              raise SystemExit('desktop preflight block anchor missing')
          text = text.replace(review_anchor, review_block + review_anchor, 1)
          panel.write_text(text)

          test = Path('services/local-core/tests/test_pilot.py')
          text = test.read_text()
          text = text.replace(
              '''        writer_model="writer-model",\n        evaluator_model="evaluator-model",\n    )\n''',
              '''        writer_model="writer-model",\n        evaluator_model="evaluator-model",\n        max_requests=3,\n        max_input_tokens=1000,\n        max_output_tokens=500,\n        max_cost_usd=1.25,\n    )\n''',
              1,
          )
          text = text.replace(
              '''        writer_model="writer-model",\n        evaluator_model="evaluator-model",\n    )\n    assert available.credential_state''',
              '''        writer_model="writer-model",\n        evaluator_model="evaluator-model",\n        max_requests=3,\n        max_input_tokens=1000,\n        max_output_tokens=500,\n        max_cost_usd=1.25,\n    )\n    assert available.credential_state''',
              1,
          )
          if 'assert available.max_requests == 3' not in text:
              text = text.replace(
                  '    assert available.paid_calls == 0\n',
                  '    assert available.paid_calls == 0\n    assert available.max_requests == 3\n    assert len(available.plan_hash) == 64\n',
                  1,
              )
          observation_anchor = '''    summary = service.summary(book_id, pilot.pilot_id)\n    assert summary.open_observations_by_severity["BLOCKING"] == 1\n'''
          observation_new = observation_anchor + '''    with pytest.raises(PilotGateError, match="requires HUMAN resolution"):\n        service.resolve_observation(\n            book_id,\n            pilot.pilot_id,\n            observation.observation_id,\n            actor="system",\n            actor_kind="SYSTEM",\n            reason="Automation cannot clear blocking evidence.",\n        )\n'''
          if observation_anchor not in text:
              raise SystemExit('pilot observation test anchor missing')
          text = text.replace(observation_anchor, observation_new, 1)
          if 'test_human_review_event_kinds_require_human_and_detail' not in text:
              text += '''\n\ndef test_human_review_event_kinds_require_human_and_detail(tmp_path: Path) -> None:\n    data_dir = tmp_path / "data"\n    book_id = _project(data_dir)\n    service = PilotService(data_dir)\n    pilot = service.start(book_id, human_actor="Elena")\n    with pytest.raises(PilotGateError, match="must be HUMAN"):\n        service.record_stage_event(\n            book_id,\n            pilot.pilot_id,\n            PilotStageEventRequest(\n                stage="BOOKBENCH",\n                event_kind="DEFECT_REVIEW",\n                actor="AI",\n                actor_kind="AI",\n                outcome="SUCCESS",\n                metadata={"reason": "invalid"},\n            ),\n        )\n    with pytest.raises(PilotGateError, match="requires nonblank judgment"):\n        service.record_stage_event(\n            book_id,\n            pilot.pilot_id,\n            PilotStageEventRequest(\n                stage="FINAL_REVIEW",\n                event_kind="LITERARY_QUALITY_JUDGMENT",\n                actor="Elena",\n                actor_kind="HUMAN",\n                outcome="SUCCESS",\n                metadata={},\n            ),\n        )\n'''
          test.write_text(text)

          api_test = Path('services/local-core/tests/test_pilot_api.py')
          text = api_test.read_text()
          request_anchor = '''            "writer_model": "writer-model",\n            "evaluator_model": "evaluator-model",\n            "editor_lane": "deterministic-m6-current",\n'''
          request_new = request_anchor + '''            "max_requests": 3,\n            "max_input_tokens": 1000,\n            "max_output_tokens": 500,\n            "max_cost_usd": 1.25,\n'''
          if request_anchor not in text:
              raise SystemExit('pilot API test request anchor missing')
          text = text.replace(request_anchor, request_new, 1)
          keys_anchor = '''        "editor_lane",\n        "external_calls",\n'''
          keys_new = '''        "editor_lane",\n        "max_requests",\n        "max_input_tokens",\n        "max_output_tokens",\n        "max_cost_usd",\n        "plan_hash",\n        "external_calls",\n'''
          if keys_anchor not in text:
              raise SystemExit('pilot API test keys anchor missing')
          api_test.write_text(text.replace(keys_anchor, keys_new, 1))

          temporal = Path('services/local-core/tests/test_pilot_temporal_evidence.py')
          text = temporal.read_text()
          if 'BOOKBENCH_MASTER_MISMATCH' not in text:
              text = text.replace(
                  '    assert summary.latest_bookbench_snapshot_id == "d" * 26\n',
                  '    assert summary.latest_bookbench_snapshot_id == "d" * 26\n    assert "BOOKBENCH_MASTER_MISMATCH" in summary.go_no_go.blockers\n',
                  1,
              )
          temporal.write_text(text)
          PY
      - run: pip install ruff==0.12.11
      - run: |
          ruff format services/local-core/src/book_os_core/pilot.py \
            services/local-core/src/book_os_core/pilot_api.py \
            services/local-core/tests/test_pilot.py \
            services/local-core/tests/test_pilot_api.py \
            services/local-core/tests/test_pilot_temporal_evidence.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pilot-final-hardening.yml
          git add services/local-core apps/desktop/src/PilotPanel.tsx apps/desktop/src/PilotPanel.test.tsx
          git commit -m 'Pilot: bind human evidence and bounded OpenAI preflight'
          git push origin HEAD:brain/task-011-real-book-pilot
