name: M5 Control Hash Sync
on: [push]
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize design hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest_path = Path('docs/DESIGN_FILE_HASHES.sha256')
          lines = manifest_path.read_text(encoding='utf-8').splitlines()
          ordered = []
          hashes = {}
          for line in lines:
              if not line.strip():
                  continue
              digest, path = line.split('  ', 1)
              ordered.append(path)
              hashes[path] = digest

          targets = [
              'docs/PROJECT_STATE.md',
              'docs/tasks/CODEX_TASK_006_BOOK_MEMORY.md',
          ]
          for path in targets:
              hashes[path] = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if path not in ordered:
                  ordered.append(path)

          manifest_path.write_text(
              ''.join(f'{hashes[path]}  {path}\n' for path in ordered),
              encoding='utf-8',
          )
          PY
      - name: Remove helper and publish canonical control baseline
        run: |
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git rm .github/workflows/m5-control-sync.yml
          git add docs/DESIGN_FILE_HASHES.sha256
          git commit -m "Synchronize M5 control baseline"
          git push origin HEAD:main
