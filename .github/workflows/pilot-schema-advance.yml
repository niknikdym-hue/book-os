name: Pilot schema advance once
on:
  push:
    branches: [brain/task-011-real-book-pilot]
    paths:
      - '.github/workflows/pilot-schema-advance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-011-real-book-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path

          backup = Path('services/local-core/src/book_os_core/backup.py')
          text = backup.read_text()
          if 'SUPPORTED_ALEMBIC_REVISION = "0009"' not in text:
              raise SystemExit('backup revision anchor not found')
          backup.write_text(text.replace('SUPPORTED_ALEMBIC_REVISION = "0009"', 'SUPPORTED_ALEMBIC_REVISION = "0010"', 1))

          candidates = [
              'services/local-core/tests/test_authority.py',
              'services/local-core/tests/test_backup_compat.py',
              'services/local-core/tests/test_bookbench.py',
              'services/local-core/tests/test_core.py',
              'services/local-core/tests/test_editorial.py',
              'services/local-core/tests/test_literary_master.py',
              'services/local-core/tests/test_memory.py',
              'services/local-core/tests/test_projects.py',
              'services/local-core/tests/test_research.py',
          ]
          for rel in candidates:
              path = Path(rel)
              text = path.read_text()
              text = text.replace('== "0009"', '== "0010"')
              text = text.replace('== ("0009",)', '== ("0010",)')
              if rel.endswith('test_core.py'):
                  marker = '            "0009",\n'
                  if marker in text and '            "0010",\n' not in text:
                      text = text.replace(marker, marker + '            "0010",\n', 1)
              path.write_text(text)
          PY
      - run: pip install ruff==0.12.11
      - run: |
          ruff format services/local-core/src/book_os_core/backup.py \
            services/local-core/tests/test_authority.py \
            services/local-core/tests/test_backup_compat.py \
            services/local-core/tests/test_bookbench.py \
            services/local-core/tests/test_core.py \
            services/local-core/tests/test_editorial.py \
            services/local-core/tests/test_literary_master.py \
            services/local-core/tests/test_memory.py \
            services/local-core/tests/test_projects.py \
            services/local-core/tests/test_research.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pilot-schema-advance.yml
          git add services/local-core
          git commit -m 'Pilot: advance schema and backup compatibility to 0010'
          git push origin HEAD:brain/task-011-real-book-pilot
