name: Task014 Architecture UI Once
on: push
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref_name == 'brain/task-014-prose-anti-junk-panel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-014-prose-anti-junk-panel
      - name: Replace legacy one-part editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/src/App.tsx')
          text = p.read_text()
          if 'import { ArchitectureEditor } from "./ArchitectureEditor";' not in text:
              text = text.replace(
                  'import { AntiJunkPanel } from "./AntiJunkPanel";\n',
                  'import { AntiJunkPanel } from "./AntiJunkPanel";\nimport { ArchitectureEditor } from "./ArchitectureEditor";\n',
                  1,
              )
          function_start = text.find('  function updateArchitectureChapter(')
          if function_start >= 0:
              function_end = text.index('  const healthLabel =', function_start)
              text = text[:function_start] + text[function_end:]
          start_marker = '''              <section className="panel">\n                <div className="panel-heading">\n                  <div>\n                    <p className="eyebrow">ЧЕЛОВЕЧЕСКОЕ РЕШЕНИЕ 2</p>\n'''
          end_marker = '              {project.chapters.length > 0 && (\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''              <ArchitectureEditor\n                architecture={architecture}\n                setArchitecture={setArchitecture}\n                statusBadge={<StatusBadge status={project.architecture?.status} />}\n                busy={busy}\n                onSave={() => void saveArchitecture()}\n                onApprove={() => void approveArchitecture()}\n              />\n\n'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text)
          Path('.github/workflows/task014-architecture-ui-once.yml').unlink()
          PY
      - name: Commit architecture editor
        run: |
          git config user.name "BOOK OS Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Show and edit complete multi-part book architecture"
          git push origin HEAD:brain/task-014-prose-anti-junk-panel
