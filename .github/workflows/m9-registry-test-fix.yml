name: M9 registry test fix once
on:
  push:
    branches: [brain/task-010-literary-master]
    paths:
      - '.github/workflows/m9-registry-test-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-010-literary-master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/local-core/tests/test_literary_master.py')
          text = path.read_text()
          start = text.index('def test_release_gate_rejects_stale_bookbench_registry')
          replacement = '''def test_release_gate_rejects_stale_bookbench_registry(tmp_path: Path) -> None:\n    data_dir = tmp_path / "data"\n    book_id = _build_release_fixture(data_dir)\n    database = data_dir / "projects" / book_id / "project.sqlite"\n    engine = create_database(database)\n    stale_snapshot_id = new_ulid()\n    try:\n        with engine.begin() as connection:\n            connection.execute(\n                text(\n                    "INSERT INTO evaluation_snapshots("\n                    "snapshot_id,book_id,scope,snapshot_json,snapshot_hash,created_at) VALUES "\n                    "(:snapshot_id,:book_id,'BOOK',:snapshot_json,:snapshot_hash,:created_at)"\n                ),\n                {\n                    "snapshot_id": stale_snapshot_id,\n                    "book_id": book_id,\n                    "snapshot_json": json.dumps({"registry_hash": "superseded-registry"}),\n                    "snapshot_hash": "f" * 64,\n                    "created_at": "9999-12-31T23:59:59.999999Z",\n                },\n            )\n    finally:\n        engine.dispose()\n\n    readiness = LiteraryMasterService(data_dir).readiness(book_id)\n    assert readiness.snapshot_id == stale_snapshot_id\n    assert readiness.ready is False\n    assert "BOOKBENCH_REGISTRY_STALE" in {item.code for item in readiness.blockers}\n'''
          path.write_text(text[:start] + replacement)
          PY
      - run: pip install ruff==0.12.11
      - run: ruff format services/local-core/tests/test_literary_master.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m9-registry-test-fix.yml
          git add services/local-core/tests/test_literary_master.py
          git commit -m 'test: preserve BookBench snapshot immutability in M9 regression'
          git push origin HEAD:brain/task-010-literary-master
