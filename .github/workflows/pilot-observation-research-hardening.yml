name: Pilot observation and research hardening once
on:
  push:
    branches: [brain/task-011-real-book-pilot]
    paths:
      - '.github/workflows/pilot-observation-research-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-011-real-book-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path

          pilot = Path('services/local-core/src/book_os_core/pilot.py')
          text = pilot.read_text()
          summary_anchor = '''    material_claims_without_evidence: int\n    editorial_by_status: dict[str, int]\n'''
          summary_new = '''    material_claims_without_evidence: int\n    material_claims_not_supported: int\n    editorial_by_status: dict[str, int]\n'''
          if summary_anchor not in text:
              raise SystemExit('PilotSummary research anchor missing')
          text = text.replace(summary_anchor, summary_new, 1)

          list_anchor = '''    def resolve_observation(\n        self,\n        book_id: str,\n        pilot_id: str,\n        observation_id: str,\n'''
          list_method = '''    def list_observations(\n        self, book_id: str, pilot_id: str, *, open_only: bool = False\n    ) -> list[PilotObservationView]:\n        engine = self._engine(book_id)\n        try:\n            with engine.connect() as connection:\n                self._pilot_row(connection, book_id, pilot_id)\n                clause = " AND resolved_at IS NULL" if open_only else ""\n                rows = list(\n                    connection.execute(\n                        text(\n                            "SELECT * FROM pilot_observations WHERE pilot_id=:pilot_id"\n                            + clause\n                            + " ORDER BY created_at,observation_id"\n                        ),\n                        {"pilot_id": pilot_id},\n                    ).mappings()\n                )\n            return [PilotObservationView(**dict(row)) for row in rows]\n        finally:\n            engine.dispose()\n\n'''
          if 'def list_observations(' not in text:
              if list_anchor not in text:
                  raise SystemExit('observation list insertion anchor missing')
              text = text.replace(list_anchor, list_method + list_anchor, 1)

          research_anchor = '''                material_without_evidence = int(\n                    connection.execute(\n                        text(\n                            "SELECT COUNT(*) FROM claims c WHERE c.book_id=:book_id "\n                            "AND c.materiality IN ('HIGH','CRITICAL') AND c.claim_type!='AUTHORIAL' "\n                            "AND NOT EXISTS (SELECT 1 FROM evidence e WHERE e.claim_id=c.claim_id "\n                            "AND e.status='ACTIVE')"\n                        ),\n                        {"book_id": book_id},\n                    ).scalar_one()\n                )\n\n                editorial_rows = list(\n'''
          research_new = '''                material_without_evidence = int(\n                    connection.execute(\n                        text(\n                            "SELECT COUNT(*) FROM claims c WHERE c.book_id=:book_id "\n                            "AND c.materiality IN ('HIGH','CRITICAL') AND c.claim_type!='AUTHORIAL' "\n                            "AND NOT EXISTS (SELECT 1 FROM evidence e WHERE e.claim_id=c.claim_id "\n                            "AND e.status='ACTIVE')"\n                        ),\n                        {"book_id": book_id},\n                    ).scalar_one()\n                )\n                material_not_supported = int(\n                    connection.execute(\n                        text(\n                            "SELECT COUNT(*) FROM claims c WHERE c.book_id=:book_id "\n                            "AND c.materiality IN ('HIGH','CRITICAL') AND c.claim_type!='AUTHORIAL' "\n                            "AND c.verification_state NOT IN ('SUPPORTED','PARTIALLY_SUPPORTED')"\n                        ),\n                        {"book_id": book_id},\n                    ).scalar_one()\n                )\n\n                editorial_rows = list(\n'''
          if research_anchor not in text:
              raise SystemExit('material research summary anchor missing')
          text = text.replace(research_anchor, research_new, 1)

          blocker_anchor = '''                if material_without_evidence:\n                    blockers.append(\n                        f"MATERIAL_RESEARCH_TRACEABILITY_GAPS:{material_without_evidence}"\n                    )\n'''
          blocker_new = blocker_anchor + '''                if material_not_supported:\n                    blockers.append(\n                        f"MATERIAL_RESEARCH_NOT_SUPPORTED:{material_not_supported}"\n                    )\n'''
          if blocker_anchor not in text:
              raise SystemExit('research blocker anchor missing')
          text = text.replace(blocker_anchor, blocker_new, 1)

          return_anchor = '''                material_claims_without_evidence=material_without_evidence,\n                editorial_by_status=editorial_by_status,\n'''
          return_new = '''                material_claims_without_evidence=material_without_evidence,\n                material_claims_not_supported=material_not_supported,\n                editorial_by_status=editorial_by_status,\n'''
          if return_anchor not in text:
              raise SystemExit('PilotSummary return research anchor missing')
          pilot.write_text(text.replace(return_anchor, return_new, 1))

          api = Path('services/local-core/src/book_os_core/pilot_api.py')
          text = api.read_text()
          text = text.replace('from fastapi import APIRouter, Depends, HTTPException\n', 'from fastapi import APIRouter, Depends, HTTPException, Query\n', 1)
          api_anchor = '''    @router.post("/api/projects/{book_id}/pilots/{pilot_id}/observations")\n    def add_observation(\n'''
          api_list = '''    @router.get("/api/projects/{book_id}/pilots/{pilot_id}/observations")\n    def list_observations(\n        book_id: str, pilot_id: str, open_only: bool = Query(default=False)\n    ) -> list[dict[str, object]]:\n        try:\n            return [\n                item.model_dump(mode="json")\n                for item in service.list_observations(book_id, pilot_id, open_only=open_only)\n            ]\n        except PilotError as exc:\n            raise_http(exc)\n        raise AssertionError("unreachable")\n\n'''
          if '/observations")\n    def list_observations' not in text:
              if api_anchor not in text:
                  raise SystemExit('pilot observations API insertion anchor missing')
              text = text.replace(api_anchor, api_list + api_anchor, 1)
          api.write_text(text)

          panel = Path('apps/desktop/src/PilotPanel.tsx')
          text = panel.read_text()
          summary_type_anchor = '''  material_claims_without_evidence: number;\n  editorial_by_status: Record<string, number>;\n'''
          summary_type_new = '''  material_claims_without_evidence: number;\n  material_claims_not_supported: number;\n  editorial_by_status: Record<string, number>;\n'''
          if summary_type_anchor not in text:
              raise SystemExit('PilotPanel summary research type anchor missing')
          text = text.replace(summary_type_anchor, summary_type_new, 1)

          type_insert = '''type OpenAIPreflight = {\n'''
          observation_type = '''type PilotObservation = {\n  observation_id: string;\n  pilot_id: string;\n  stage: string;\n  category: string;\n  severity: string;\n  actor: string;\n  actor_kind: string;\n  description: string;\n  artifact_ref: string | null;\n  created_at: string;\n  resolved_at: string | null;\n  resolution_actor: string | null;\n  resolution_actor_kind: string | null;\n  resolution_reason: string | null;\n};\n\n'''
          if 'type PilotObservation = {' not in text:
              text = text.replace(type_insert, observation_type + type_insert, 1)

          stages_end = '''] as const;\n\nexport function PilotPanel'''
          category_block = '''] as const;\n\nconst observationCategories = [\n  "PRODUCT_DEFECT",\n  "WORKFLOW_FRICTION",\n  "MISSED_ERROR",\n  "BOOKBENCH_FALSE_POSITIVE",\n  "BOOKBENCH_FALSE_NEGATIVE",\n  "MODEL_QUALITY_FAILURE",\n  "VOICE_FAILURE",\n  "RESEARCH_TRACEABILITY_FAILURE",\n  "HUMAN_DECISION_REASON",\n  "OTHER",\n] as const;\n\nexport function PilotPanel'''
          if 'const observationCategories = [' not in text:
              if stages_end not in text:
                  raise SystemExit('PilotPanel categories insertion anchor missing')
              text = text.replace(stages_end, category_block, 1)

          state_anchor = '''  const [observationText, setObservationText] = useState("");\n  const [observationSeverity, setObservationSeverity] = useState("ATTENTION");\n'''
          state_new = '''  const [observationText, setObservationText] = useState("");\n  const [observationSeverity, setObservationSeverity] = useState("ATTENTION");\n  const [observationCategory, setObservationCategory] = useState<(typeof observationCategories)[number]>(\n    "WORKFLOW_FRICTION",\n  );\n  const [openObservations, setOpenObservations] = useState<PilotObservation[]>([]);\n  const [resolutionReason, setResolutionReason] = useState("");\n'''
          if state_anchor not in text:
              raise SystemExit('PilotPanel observation state anchor missing')
          text = text.replace(state_anchor, state_new, 1)

          refresh_anchor = '''    if (active) {\n      setSummary(\n        await coreApi<PilotSummary>(\n          "GET",\n          `/api/projects/${project.book_id}/pilots/${active.pilot_id}/summary`,\n        ),\n      );\n    } else {\n      setSummary(null);\n    }\n'''
          refresh_new = '''    if (active) {\n      const [nextSummary, observations] = await Promise.all([\n        coreApi<PilotSummary>(\n          "GET",\n          `/api/projects/${project.book_id}/pilots/${active.pilot_id}/summary`,\n        ),\n        coreApi<PilotObservation[]>(\n          "GET",\n          `/api/projects/${project.book_id}/pilots/${active.pilot_id}/observations?open_only=true`,\n        ),\n      ]);\n      setSummary(nextSummary);\n      setOpenObservations(observations);\n    } else {\n      setSummary(null);\n      setOpenObservations([]);\n    }\n'''
          if refresh_anchor not in text:
              raise SystemExit('PilotPanel refresh observations anchor missing')
          text = text.replace(refresh_anchor, refresh_new, 1)

          text = text.replace('          category: "WORKFLOW_FRICTION",\n', '          category: observationCategory,\n', 1)

          add_fn_anchor = '''  async function checkOpenAI() {\n'''
          resolve_fn = '''  async function resolveObservation(observationId: string) {\n    if (!pilot || !humanActor.trim() || !resolutionReason.trim()) return;\n    setBusy(true);\n    setError(null);\n    try {\n      await coreApi(\n        "POST",\n        `/api/projects/${project.book_id}/pilots/${pilot.pilot_id}/observations/${observationId}/resolve`,\n        {\n          actor: humanActor.trim(),\n          actor_kind: "HUMAN",\n          reason: resolutionReason.trim(),\n        },\n      );\n      setResolutionReason("");\n      await refresh();\n    } catch (reason) {\n      setError(String(reason));\n    } finally {\n      setBusy(false);\n    }\n  }\n\n'''
          if 'async function resolveObservation(' not in text:
              if add_fn_anchor not in text:
                  raise SystemExit('PilotPanel resolve function anchor missing')
              text = text.replace(add_fn_anchor, resolve_fn + add_fn_anchor, 1)

          severity_anchor = '''                <label className="field">\n                  <span>Severity</span>\n                  <select\n                    value={observationSeverity}\n                    onChange={(event) => setObservationSeverity(event.target.value)}\n                  >\n                    <option>INFO</option>\n                    <option>ATTENTION</option>\n                    <option>BLOCKING</option>\n                  </select>\n                </label>\n'''
          category_ui = '''                <label className="field">\n                  <span>Observation category</span>\n                  <select\n                    value={observationCategory}\n                    onChange={(event) =>\n                      setObservationCategory(event.target.value as (typeof observationCategories)[number])\n                    }\n                  >\n                    {observationCategories.map((item) => (\n                      <option key={item}>{item}</option>\n                    ))}\n                  </select>\n                </label>\n'''
          if 'Observation category' not in text:
              if severity_anchor not in text:
                  raise SystemExit('PilotPanel severity UI anchor missing')
              text = text.replace(severity_anchor, category_ui + severity_anchor, 1)

          pre_review_anchor = '''              <div className="form-grid" aria-label="Human pilot reviews">\n'''
          obs_list = '''              {openObservations.length > 0 && (\n                <div aria-label="Open pilot observations">\n                  <strong>Open pilot observations</strong>\n                  <label className="field">\n                    <span>Human resolution reason</span>\n                    <input\n                      value={resolutionReason}\n                      onChange={(event) => setResolutionReason(event.target.value)}\n                    />\n                  </label>\n                  <ul>\n                    {openObservations.map((item) => (\n                      <li key={item.observation_id}>\n                        <code>{item.severity}</code> · {item.category} · {item.description}{" "}\n                        <button\n                          className="secondary"\n                          onClick={() => void resolveObservation(item.observation_id)}\n                          disabled={busy || !humanActor.trim() || !resolutionReason.trim()}\n                        >\n                          Resolve as HUMAN\n                        </button>\n                      </li>\n                    ))}\n                  </ul>\n                </div>\n              )}\n\n'''
          if 'aria-label="Open pilot observations"' not in text:
              if pre_review_anchor not in text:
                  raise SystemExit('PilotPanel observation list insertion anchor missing')
              text = text.replace(pre_review_anchor, obs_list + pre_review_anchor, 1)
          panel.write_text(text)

          pilot_test = Path('services/local-core/tests/test_pilot.py')
          text = pilot_test.read_text()
          list_anchor = '''    resolved = service.resolve_observation(\n'''
          list_assert = '''    all_observations = service.list_observations(book_id, pilot.pilot_id)\n    open_observations = service.list_observations(book_id, pilot.pilot_id, open_only=True)\n    assert [item.observation_id for item in all_observations] == [observation.observation_id]\n    assert [item.observation_id for item in open_observations] == [observation.observation_id]\n\n'''
          if 'all_observations = service.list_observations' not in text:
              if list_anchor not in text:
                  raise SystemExit('PilotService observation list test anchor missing')
              text = text.replace(list_anchor, list_assert + list_anchor, 1)
          resolved_anchor = '''    assert resolved.resolved_at is not None\n'''
          resolved_new = resolved_anchor + '''    assert service.list_observations(book_id, pilot.pilot_id, open_only=True) == []\n'''
          if 'open_only=True) == []' not in text:
              if resolved_anchor not in text:
                  raise SystemExit('PilotService resolved list test anchor missing')
              text = text.replace(resolved_anchor, resolved_new, 1)

          if 'test_material_claim_must_be_positively_supported_for_go_readiness' not in text:
              text += '''\n\ndef test_material_claim_must_be_positively_supported_for_go_readiness(tmp_path: Path) -> None:\n    data_dir = tmp_path / "data"\n    book_id = _project(data_dir)\n    service = PilotService(data_dir)\n    pilot = service.start(book_id, human_actor="Elena")\n    database = data_dir / "projects" / book_id / "project.sqlite"\n    engine = create_database(database)\n    try:\n        with engine.begin() as connection:\n            connection.execute(\n                text(\n                    "INSERT INTO claims("\n                    "claim_id,book_id,chapter_id,unit_id,manuscript_revision_id,manuscript_revision_hash,"\n                    "normalized_text,claim_type,materiality,required_evidence_level,verification_state,"\n                    "created_at,updated_at) VALUES "\n                    "(:claim_id,:book_id,'C','U','R',:revision_hash,'Material fact','EMPIRICAL','HIGH',"\n                    "'TRACEABLE_SOURCE','UNREVIEWED',:now,:now)"\n                ),\n                {\n                    "claim_id": "Q" * 26,\n                    "book_id": book_id,\n                    "revision_hash": "a" * 64,\n                    "now": "9999-01-01T00:00:00Z",\n                },\n            )\n    finally:\n        engine.dispose()\n    summary = service.summary(book_id, pilot.pilot_id)\n    assert summary.material_claims_not_supported == 1\n    assert "MATERIAL_RESEARCH_NOT_SUPPORTED:1" in summary.go_no_go.blockers\n'''
          pilot_test.write_text(text)

          api_test = Path('services/local-core/tests/test_pilot_api.py')
          text = api_test.read_text()
          resolve_anchor = '''    resolved = client.post(\n'''
          api_list = '''    listed = client.get(\n        f"/api/projects/{book_id}/pilots/{pilot_id}/observations?open_only=true",\n        headers=headers,\n    )\n    assert listed.status_code == 200\n    assert [item["observation_id"] for item in listed.json()] == [observation_id]\n\n'''
          if 'observations?open_only=true' not in text:
              if resolve_anchor not in text:
                  raise SystemExit('Pilot API observation list test anchor missing')
              text = text.replace(resolve_anchor, api_list + resolve_anchor, 1)
          api_test.write_text(text)

          desktop_test = Path('apps/desktop/src/PilotPanel.test.tsx')
          text = desktop_test.read_text()
          text = text.replace(
              '''    material_claims_without_evidence: 0,\n    editorial_by_status: {},\n''',
              '''    material_claims_without_evidence: 0,\n    material_claims_not_supported: 0,\n    editorial_by_status: {},\n''',
              1,
          )
          # Every mocked active pilot refresh must support open-observation reads.
          occurrences = text.count('if (method === "GET" && path.endsWith("/summary"))')
          if 'path.includes("/observations?open_only=true")' not in text:
              text = text.replace(
                  '''    if (method === "GET" && path.endsWith("/summary")) return summary(false) as never;\n''',
                  '''    if (method === "GET" && path.endsWith("/summary")) return summary(false) as never;\n    if (method === "GET" && path.includes("/observations?open_only=true")) return [] as never;\n''',
                  1,
              )
              text = text.replace(
                  '''    if (method === "GET" && path.endsWith("/summary")) return summary(false) as never;\n''',
                  '''    if (method === "GET" && path.endsWith("/summary")) return summary(false) as never;\n    if (method === "GET" && path.includes("/observations?open_only=true")) return [] as never;\n''',
                  1,
              )
              text = text.replace(
                  '''    if (method === "GET" && path.endsWith("/summary")) return summary(true) as never;\n''',
                  '''    if (method === "GET" && path.endsWith("/summary")) return summary(true) as never;\n    if (method === "GET" && path.includes("/observations?open_only=true")) return [] as never;\n''',
                  1,
              )
          if occurrences < 3:
              raise SystemExit('unexpected PilotPanel test structure')
          if 'resolves an open categorized observation as HUMAN' not in text:
              text += '''\n\ntest("resolves an open categorized observation as HUMAN", async () => {\n  let resolved = false;\n  vi.mocked(coreApi).mockImplementation(async (method, path, body) => {\n    if (method === "GET" && path.endsWith("/pilots/active")) return pilot as never;\n    if (method === "GET" && path.endsWith("/summary")) return summary(false) as never;\n    if (method === "GET" && path.includes("/observations?open_only=true")) {\n      return (resolved\n        ? []\n        : [\n            {\n              observation_id: "O1",\n              pilot_id: "P1",\n              stage: "BOOKBENCH",\n              category: "BOOKBENCH_FALSE_POSITIVE",\n              severity: "ATTENTION",\n              actor: "Elena",\n              actor_kind: "HUMAN",\n              description: "Synthetic false positive",\n              artifact_ref: null,\n              created_at: "2026-08-29T00:00:00Z",\n              resolved_at: null,\n              resolution_actor: null,\n              resolution_actor_kind: null,\n              resolution_reason: null,\n            },\n          ]) as never;\n    }\n    if (method === "POST" && path.endsWith("/observations/O1/resolve")) {\n      expect(body).toEqual({\n        actor: "Elena",\n        actor_kind: "HUMAN",\n        reason: "Reviewed and dismissed.",\n      });\n      resolved = true;\n      return {} as never;\n    }\n    throw new Error(`unexpected API call ${method} ${path}`);\n  });\n\n  render(<PilotPanel project={project} />);\n  expect(await screen.findByText(/BOOKBENCH_FALSE_POSITIVE/)).toBeInTheDocument();\n  fireEvent.change(screen.getByLabelText("Human actor"), { target: { value: "Elena" } });\n  fireEvent.change(screen.getByLabelText("Human resolution reason"), {\n    target: { value: "Reviewed and dismissed." },\n  });\n  fireEvent.click(screen.getByText("Resolve as HUMAN"));\n  await waitFor(() => expect(screen.queryByText(/Synthetic false positive/)).not.toBeInTheDocument());\n});\n'''
          desktop_test.write_text(text)
          PY
      - run: pip install ruff==0.12.11
      - run: |
          ruff format services/local-core/src/book_os_core/pilot.py \
            services/local-core/src/book_os_core/pilot_api.py \
            services/local-core/tests/test_pilot.py \
            services/local-core/tests/test_pilot_api.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pilot-observation-research-hardening.yml
          git add services/local-core apps/desktop/src/PilotPanel.tsx apps/desktop/src/PilotPanel.test.tsx
          git commit -m 'Pilot: complete observation workflow and research readiness'
          git push origin HEAD:brain/task-011-real-book-pilot
