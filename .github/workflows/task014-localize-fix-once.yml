              ('<option>ATTENTION</option>', '<option value="ATTENTION">{uiLabel("ATTENTION")}</option>'),
              ('<option>BLOCKING</option>', '<option value="BLOCKING">{uiLabel("BLOCKING")}</option>'),
              ('{observationCategories.map((item) => (\n                      <option key={item}>{item}</option>\n                    ))}', '{observationCategories.map((item) => (\n                      <option key={item} value={item}>{uiLabel(item)}</option>\n                    ))}'),
              ('<code>{item.severity}</code> · {item.category}', '<code>{uiLabel(item.severity)}</code> · {uiLabel(item.category)}'),
          ])

          # Remove this one-time workflow after the patch.
          Path('.github/workflows/task014-localize-fix-once.yml').unlink()
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.12.11
      - run: ruff format services/local-core/src/book_os_core services/local-core/tests/test_task014_launch.py
      - name: Commit patch
        run: |
          git config user.name "BOOK OS Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Russian first-book launch workspace"
          git push origin HEAD:brain/task-014-prose-anti-junk-panel
