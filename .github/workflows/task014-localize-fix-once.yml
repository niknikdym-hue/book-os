name: Task014 Localize Fix Once
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.ref_name == 'brain/task-014-prose-anti-junk-panel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-014-prose-anti-junk-panel
      - name: Apply Russian UI and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_many(path: str, pairs: list[tuple[str, str]]) -> None:
              p = Path(path)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      print(f"MISS {path}: {old[:70]!r}")
                      continue
                  text = text.replace(old, new)
              p.write_text(text)

          # Backend correctness fixes.
          replace_many(
              'services/local-core/src/book_os_core/anti_junk.py',
              [('from .authority_types import new_ulid, utc_now', 'from .authority import new_ulid\nfrom .authority_types import utc_now')],
          )
          replace_many(
              'services/local-core/src/book_os_core/planning.py',
              [(
                  '''        authority_inputs = [\n            AuthorityInputRef(\n                revision_id=contract.authority_revision_id,\n                revision_hash=contract.revision_id\n                and contract.revision_id\n                and contract.revision_id,\n                entity_type="book.contract",\n            )\n        ]\n        # The authority hash is recovered from the durable revision row below; DocumentView exposes IDs only.\n        engine = self._engine(book_id)\n''',
                  '''        engine = self._engine(book_id)\n'''
              ), (
                  '''        authority_inputs[0].revision_hash = str(revision_hash)\n        run_id, raw, usage, provider_run_id = self._run(\n''',
                  '''        authority_inputs = [\n            AuthorityInputRef(\n                revision_id=contract.authority_revision_id,\n                revision_hash=str(revision_hash),\n                entity_type="book.contract",\n            )\n        ]\n        run_id, raw, usage, provider_run_id = self._run(\n'''
              )],
          )

          # Current-head schema assertions.
          for p in Path('services/local-core/tests').glob('test_*.py'):
              text = p.read_text()
              text = text.replace('== "0010"', '== "0011"')
              if p.name == 'test_core.py' and '"0011"' not in text:
                  text = text.replace('            "0010",\n        }', '            "0010",\n            "0011",\n        }')
              text = text.replace('assert len(runs) == 7', 'assert len(runs) == 8')
              p.write_text(text)

          # Common uiLabel imports.
          for path in [
              'apps/desktop/src/ResearchPanel.tsx',
              'apps/desktop/src/BookMemoryPanel.tsx',
              'apps/desktop/src/EditorialPanel.tsx',
              'apps/desktop/src/BookBenchPanel.tsx',
              'apps/desktop/src/PilotPanel.tsx',
