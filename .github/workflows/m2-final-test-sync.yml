name: M2 Final Test Sync
on: [push]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: brain/task-003-book-creation-contracts }
      - run: sed -i 's/== ("0002",)/== ("0003",)/' services/local-core/tests/test_authority.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add services/local-core/tests/test_authority.py
          git commit -m "test: advance final M1 tuple regression to M2"
          git push origin HEAD:brain/task-003-book-creation-contracts
