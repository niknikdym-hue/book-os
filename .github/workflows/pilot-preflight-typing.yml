name: Pilot preflight typing once
on:
  push:
    branches: [brain/task-011-real-book-pilot]
    paths:
      - '.github/workflows/pilot-preflight-typing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-011-real-book-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/local-core/src/book_os_core/pilot.py')
          text = path.read_text()
          text = text.replace(
              '    max_cost_usd: float | None\n',
              '    max_cost_usd: float\n',
              1,
          )
          old = '''        return OpenAIPreflightView(\n            credential_state=credential_state,\n            plan_hash=plan_hash,\n            **plan,\n        )\n'''
          new = '''        return OpenAIPreflightView(\n            book_id=book_id.strip(),\n            pilot_id=pilot_id.strip(),\n            credential_state=credential_state,\n            writer_model=writer_model.strip(),\n            evaluator_model=evaluator_model.strip(),\n            editor_lane=editor_lane.strip(),\n            max_requests=max_requests,\n            max_input_tokens=max_input_tokens,\n            max_output_tokens=max_output_tokens,\n            max_cost_usd=max_cost_usd,\n            plan_hash=plan_hash,\n        )\n'''
          if old not in text:
              raise SystemExit('preflight return anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pip install ruff==0.12.11
      - run: ruff format services/local-core/src/book_os_core/pilot.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pilot-preflight-typing.yml
          git add services/local-core/src/book_os_core/pilot.py
          git commit -m 'Pilot: make bounded OpenAI preflight typing explicit'
          git push origin HEAD:brain/task-011-real-book-pilot
