name: Pilot readiness hardening once
on:
  push:
    branches: [brain/task-011-real-book-pilot]
    paths:
      - '.github/workflows/pilot-readiness-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-011-real-book-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path

          pilot = Path('services/local-core/src/book_os_core/pilot.py')
          text = pilot.read_text()
          mandatory_anchor = '''MANDATORY_STAGES: tuple[PilotStage, ...] = (\n    "IDEA",\n    "BOOK_DEFINITION",\n    "RESEARCH",\n    "BOOK_CONTRACT",\n    "ARCHITECTURE",\n    "CHAPTER_CONTRACTS",\n    "DRAFTING",\n    "BOOK_MEMORY",\n    "EDITORIAL",\n    "BOOKBENCH",\n    "FINAL_REVIEW",\n    "LITERARY_MASTER",\n)\n'''
          completion = mandatory_anchor + '''\nSTAGE_COMPLETION_EVENT_KINDS = {\n    "COMPLETED",\n    "HUMAN_REVIEW",\n    "NOT_APPLICABLE",\n    "LITERARY_QUALITY_JUDGMENT",\n    "DEFECT_REVIEW",\n}\n'''
          if 'STAGE_COMPLETION_EVENT_KINDS' not in text:
              if mandatory_anchor not in text:
                  raise SystemExit('mandatory stages anchor missing')
              text = text.replace(mandatory_anchor, completion, 1)

          old_counts = '                stage_counts = Counter(str(row["stage"]) for row in stage_rows)\n'
          new_counts = '''                stage_counts = Counter(\n                    str(row["stage"])\n                    for row in stage_rows\n                    if str(row["event_kind"]) in STAGE_COMPLETION_EVENT_KINDS\n                )\n'''
          if old_counts not in text:
              raise SystemExit('stage counts anchor missing')
          text = text.replace(old_counts, new_counts, 1)

          old_snapshot = '''                            "SELECT snapshot_id FROM evaluation_snapshots WHERE book_id=:book_id "\n                            "AND scope='BOOK' ORDER BY created_at DESC,snapshot_id DESC LIMIT 1"\n                        ),\n                        {"book_id": book_id},\n'''
          new_snapshot = '''                            "SELECT snapshot_id FROM evaluation_snapshots WHERE book_id=:book_id "\n                            "AND scope='BOOK' AND created_at>=:started_at "\n                            "ORDER BY created_at DESC,snapshot_id DESC LIMIT 1"\n                        ),\n                        {"book_id": book_id, "started_at": pilot.started_at},\n'''
          if old_snapshot not in text:
              raise SystemExit('snapshot anchor missing')
          text = text.replace(old_snapshot, new_snapshot, 1)

          old_master = '''                            "SELECT master_id,manifest_hash FROM literary_masters "\n                            "WHERE book_id=:book_id AND status='LOCKED' "\n                            "ORDER BY created_at DESC,master_id DESC LIMIT 1"\n                        ),\n                        {"book_id": book_id},\n'''
          new_master = '''                            "SELECT master_id,manifest_hash FROM literary_masters "\n                            "WHERE book_id=:book_id AND status='LOCKED' AND created_at>=:started_at "\n                            "ORDER BY created_at DESC,master_id DESC LIMIT 1"\n                        ),\n                        {"book_id": book_id, "started_at": pilot.started_at},\n'''
          if old_master not in text:
              raise SystemExit('master anchor missing')
          pilot.write_text(text.replace(old_master, new_master, 1))

          panel = Path('apps/desktop/src/PilotPanel.tsx')
          text = panel.read_text()
          text = text.replace('async function recordCheckpoint()', 'async function recordStageCompleted()', 1)
          text = text.replace('event_kind: "CHECKPOINT"', 'event_kind: "COMPLETED"', 1)
          text = text.replace('onClick={() => void recordCheckpoint()}', 'onClick={() => void recordStageCompleted()}', 1)
          text = text.replace('Record stage checkpoint', 'Mark stage complete', 1)
          panel.write_text(text)

          app = Path('apps/desktop/src/App.tsx')
          text = app.read_text()
          anchor = 'import { LiteraryMasterPanel } from "./LiteraryMasterPanel";\n'
          if 'import { PilotPanel } from "./PilotPanel";' not in text:
              text = text.replace(anchor, anchor + 'import { PilotPanel } from "./PilotPanel";\n', 1)
          render_anchor = '              <LiteraryMasterPanel project={project} />\n'
          if '<PilotPanel project={project} />' not in text:
              text = text.replace(render_anchor, render_anchor + '              <PilotPanel project={project} />\n', 1)
          app.write_text(text)

          test = Path('services/local-core/tests/test_pilot.py')
          text = test.read_text()
          if 'def test_checkpoint_does_not_complete_mandatory_stage' not in text:
              text += '''\n\ndef test_checkpoint_does_not_complete_mandatory_stage(tmp_path: Path) -> None:\n    data_dir = tmp_path / "data"\n    book_id = _project(data_dir)\n    service = PilotService(data_dir)\n    pilot = service.start(book_id, human_actor="Elena")\n    service.record_stage_event(\n        book_id,\n        pilot.pilot_id,\n        PilotStageEventRequest(\n            stage="IDEA",\n            event_kind="CHECKPOINT",\n            actor="Elena",\n            actor_kind="HUMAN",\n            outcome="SUCCESS",\n        ),\n    )\n    summary = service.summary(book_id, pilot.pilot_id)\n    assert summary.stage_event_counts.get("IDEA", 0) == 0\n    assert any(blocker.startswith("MISSING_STAGES:") and "IDEA" in blocker for blocker in summary.go_no_go.blockers)\n'''
          test.write_text(text)
          PY
      - run: pip install ruff==0.12.11
      - run: |
          ruff format services/local-core/src/book_os_core/pilot.py services/local-core/tests/test_pilot.py
      - run: |
          cd apps/desktop
          corepack enable
          pnpm install --frozen-lockfile --prod=false
          pnpm exec prettier --write src/App.tsx src/PilotPanel.tsx src/PilotPanel.test.tsx
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pilot-readiness-hardening.yml
          git add services/local-core/src/book_os_core/pilot.py services/local-core/tests/test_pilot.py apps/desktop/src/App.tsx apps/desktop/src/PilotPanel.tsx apps/desktop/src/PilotPanel.test.tsx
          git commit -m 'Pilot: harden evidence readiness and wire desktop workspace'
          git push origin HEAD:brain/task-011-real-book-pilot
