name: M8 Stage B hardening once

on:
  push:
    branches:
      - brain/task-009-russia-provider-lane
    paths:
      - .github/workflows/m8-stage-b-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-009-russia-provider-lane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded hardening and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path

          stage = Path('services/local-core/src/book_os_core/stage_b.py')
          text = stage.read_text()
          start = text.index('def production_capabilities(')
          end = text.index('\n\ndef production_route(', start)
          replacement = '''def production_capabilities(\n    lane: ProviderLaneService,\n    *,\n    role: str,\n    now: datetime | None = None,\n    live_health_ttl: timedelta = timedelta(hours=24),\n) -> tuple[ProviderCapability, ...]:\n    \"\"\"Delegate production health to the canonical ProviderLaneService.\n\n    ProviderLaneService already enforces LIVE-only evidence, exact current\n    matrix_hash, exact provider/model/config/region identity and freshness.\n    Stage B must not reimplement or weaken those semantics. The optional time\n    arguments remain for API compatibility only.\n    \"\"\"\n\n    _ = (now, live_health_ttl)\n    return lane.capabilities(role=role)\n'''
          stage.write_text(text[:start] + replacement + text[end:])

          drafting = Path('services/local-core/src/book_os_core/drafting.py')
          dtext = drafting.read_text()
          old = '                    "model_version": model_request.model,\n'
          new = '                    "model_version": str(result.usage.get("model_version") or model_request.model),\n'
          if old not in dtext:
              raise SystemExit('drafting model_version target not found')
          drafting.write_text(dtext.replace(old, new, 1))
          PY
          python -m pip install ruff==0.12.11
          cd services/local-core
          ruff format src/book_os_core/stage_b.py src/book_os_core/drafting.py
          ruff check src/book_os_core/stage_b.py src/book_os_core/drafting.py
          cd ../..
          rm .github/workflows/m8-stage-b-hardening-once.yml
          git config user.name "BOOK OS Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add services/local-core/src/book_os_core/stage_b.py services/local-core/src/book_os_core/drafting.py .github/workflows/m8-stage-b-hardening-once.yml
          git commit -m "M8: preserve exact live health and model provenance"
          git push origin HEAD:brain/task-009-russia-provider-lane
