name: M4 CI Fix
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/brain/task-005-research-claim-ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-005-research-claim-ledger
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.12.11
      - run: python .github/scripts/m4_ci_fix.py
      - name: Commit bounded fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add apps/desktop/src/ResearchPanel.tsx services/local-core/src/book_os_core/research.py services/local-core/src/book_os_core/research_adapters.py services/local-core/tests/test_research.py services/local-core/tests/test_authority.py services/local-core/tests/test_backup_compat.py services/local-core/tests/test_projects.py
          git commit -m "fix: satisfy M4 formatting and schema regressions"
          git push origin HEAD:brain/task-005-research-claim-ledger
