name: M4 Format Research
on: [push]
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/brain/task-005-research-claim-ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-005-research-claim-ledger
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.12.11
      - run: ruff format services/local-core/src/book_os_core/research.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add services/local-core/src/book_os_core/research.py
          git commit -m "style: format final M4 research typing"
          git push origin HEAD:brain/task-005-research-claim-ledger
