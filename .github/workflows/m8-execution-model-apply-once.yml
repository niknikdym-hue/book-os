name: M8 execution model apply once

on:
  push:
    branches:
      - brain/task-009-russia-provider-lane
    paths:
      - .github/workflows/m8-execution-model-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-009-russia-provider-lane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/m8_execution_model_patch.py
      - run: python -m pip install ruff==0.12.11
      - run: |
          cd services/local-core
          ruff format src/book_os_core/stage_b.py src/book_os_core/stage_b_execution.py src/book_os_core/stage_b_bookbench.py src/book_os_core/stage_b_editor.py src/book_os_core/stage_b_judge.py src/book_os_core/stage_b_cli.py tests/test_stage_b_cli.py
          ruff check src/book_os_core/stage_b.py src/book_os_core/stage_b_execution.py src/book_os_core/stage_b_bookbench.py src/book_os_core/stage_b_editor.py src/book_os_core/stage_b_judge.py src/book_os_core/stage_b_cli.py tests/test_stage_b_cli.py
      - run: rm .github/scripts/m8_execution_model_patch.py .github/workflows/m8-execution-model-apply-once.yml
      - name: Commit exact execution identity hardening
        run: |
          git config user.name "BOOK OS Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add services/local-core/src/book_os_core/stage_b.py services/local-core/src/book_os_core/stage_b_execution.py services/local-core/src/book_os_core/stage_b_bookbench.py services/local-core/src/book_os_core/stage_b_editor.py services/local-core/src/book_os_core/stage_b_judge.py services/local-core/src/book_os_core/stage_b_cli.py services/local-core/tests/test_stage_b_cli.py .github/scripts/m8_execution_model_patch.py .github/workflows/m8-execution-model-apply-once.yml
          git commit -m "M8 exact execution model identity"
          git push origin HEAD:brain/task-009-russia-provider-lane
