name: M4 Crossref Type Fix
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/brain/task-005-research-claim-ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-005-research-claim-ledger
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/m4_crossref_type_fix.py
      - name: Commit bounded fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add services/local-core/src/book_os_core/research_adapters.py
          git commit -m "fix: type Crossref research params"
          git push origin HEAD:brain/task-005-research-claim-ledger
