name: Task 020 Orchestrator FK Fix
on:
  push:
    branches:
      - codex/task-020-implementation-20260909
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Run Task 020 orchestration FK fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/task-020-implementation-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local-core dependencies
        working-directory: services/local-core
        run: pip install -r requirements-dev.lock
      - name: Apply orchestration FK fix
        run: python .github/task020_orchestrator_fk_fix.py
      - name: Validate full backend
        working-directory: services/local-core
        run: |
          ruff format .
          ruff check .
          mypy src
          pytest -q
      - name: Commit verified fix and remove temporary files
        shell: bash
        run: |
          rm -f .github/task020_orchestrator_fk_fix.py
          rm -f .github/workflows/task020-orchestrator-fk-fix.yml
          git diff --check
          git config user.name 'book-os-ci'
          git config user.email 'book-os-ci@users.noreply.github.com'
          git add -A
          git commit -m 'Task 020: keep quality-loop provenance out of editorial run FK'
          git push origin HEAD:codex/task-020-implementation-20260909
