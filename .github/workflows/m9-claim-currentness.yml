name: M9 claim currentness once
on:
  push:
    branches: [brain/task-010-literary-master]
    paths:
      - '.github/workflows/m9-claim-currentness.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/task-010-literary-master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/local-core/src/book_os_core/literary_master.py')
          text = path.read_text()
          text = text.replace(
              '"SELECT snapshot_id,snapshot_hash FROM evaluation_snapshots "',
              '"SELECT snapshot_id,snapshot_hash,created_at FROM evaluation_snapshots "',
              1,
          )
          anchor = '''            if actual_snapshot != expected_snapshot:\n                blockers.append(\n                    ReleaseBlocker(\n                        code="BOOKBENCH_SNAPSHOT_STALE",\n                        detail="Latest BookBench snapshot does not match exact release revisions",\n                    )\n                )\n'''
          addition = anchor + '''            snapshot_claim_count = int(\n                connection.execute(\n                    text(\n                        "SELECT COUNT(*) FROM evaluation_snapshot_targets "\n                        "WHERE snapshot_id=:snapshot_id AND target_kind='CLAIM'"\n                    ),\n                    {"snapshot_id": snapshot_id},\n                ).scalar_one()\n            )\n            current_claim_count = int(\n                connection.execute(\n                    text("SELECT COUNT(*) FROM claims WHERE book_id=:book_id"),\n                    {"book_id": book_id},\n                ).scalar_one()\n            )\n            claims_changed_after_snapshot = int(\n                connection.execute(\n                    text(\n                        "SELECT COUNT(*) FROM claims WHERE book_id=:book_id AND updated_at>:snapshot_created_at"\n                    ),\n                    {\n                        "book_id": book_id,\n                        "snapshot_created_at": str(snapshot["created_at"]),\n                    },\n                ).scalar_one()\n            )\n            if snapshot_claim_count != current_claim_count or claims_changed_after_snapshot:\n                blockers.append(\n                    ReleaseBlocker(\n                        code="BOOKBENCH_CLAIM_STATE_STALE",\n                        detail="Claim state changed after the latest BookBench release snapshot",\n                    )\n                )\n'''
          if anchor not in text:
              raise SystemExit('snapshot stale anchor not found')
          path.write_text(text.replace(anchor, addition, 1))
          PY
      - run: pip install ruff==0.12.11
      - run: ruff format services/local-core/src/book_os_core/literary_master.py
      - run: |
          git config user.name 'BOOK OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m9-claim-currentness.yml
          git add services/local-core/src/book_os_core/literary_master.py
          git commit -m 'M9: fail release when claim state outgrows BookBench snapshot'
          git push origin HEAD:brain/task-010-literary-master
