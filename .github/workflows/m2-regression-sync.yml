name: M2 Regression Sync
on: [push]
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/brain/task-003-book-creation-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: brain/task-003-book-creation-contracts }
      - name: Advance accepted M1 regression expectations to current schema head
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/local-core/tests/test_authority.py')
          text = path.read_text()
          old = '== "0002"'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 old schema assertions, found {count}')
          path.write_text(text.replace(old, '== "0003"'))
          PY
      - name: Commit exact regression update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "book-os-ci"
          git config user.email "book-os-ci@users.noreply.github.com"
          git add services/local-core/tests/test_authority.py
          git commit -m "test: advance M1 regression expectations to M2"
          git push origin HEAD:brain/task-003-book-creation-contracts
